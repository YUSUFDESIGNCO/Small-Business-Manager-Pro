:root{
  --navy:#00327D;
  --navy-2:#0B4FA0;
  --navy-dim:#5471A3;
  --magenta:#D50083;
  --magenta-soft:#FBE4F1;
  --cream:#F5F3EE;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --border:#E6E1D6;
  --text:#1B2433;
  --text-soft:#616B7A;
  --green:#1E8F5C;
  --green-soft:#E3F5EC;
  --amber:#B7791F;
  --amber-soft:#FBF0DB;
  --red:#C0293F;
  --red-soft:#FBE3E7;
  --radius:12px;
  --radius-lg:16px;
  --shadow: 0 1px 2px rgba(0,50,125,.06), 0 6px 18px rgba(0,50,125,.08);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* ============================================================
   YDC TYPOGRAPHY SYSTEM — single Montserrat family, one weight
   scale used consistently everywhere (sidebar, headings, KPI
   numbers, buttons, forms, tables, badges, modals, charts):
     Page/App Title ........ 700
     Section Heading ....... 700
     Card Heading (h3/h4 in cards, modals, empty states) .. 600
     Body Text .............. 400
     Labels (form) ........... 600
     Buttons .................. 600
     Navigation ................ 600
     KPI Numbers .................. 700
   ============================================================ */
body{
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--text);
  font-size:14px;
  font-weight:400;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--navy);}
.modal-header h3,.card-header h3,.empty-state h4,.welcome-option h4{font-weight:600;}
p{margin:0 0 8px;}
button{font-family:inherit;font-weight:600;cursor:pointer;}
a{color:var(--navy);}
input,select,textarea{font-family:inherit;font-weight:400;max-width:100%;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D7D0C0;border-radius:8px;}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ---------- App shell layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:240px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.14);}
#sidebar .brand .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#sidebar .brand h1{color:#fff;font-size:15.5px;line-height:1.25;}
#sidebar .brand .tagline{color:rgba(255,255,255,.65);font-size:10.5px;margin-top:4px;letter-spacing:.3px;text-transform:uppercase;}
.nav-section{padding:14px 12px 4px;}
.nav-section-title{color:rgba(255,255,255,.5);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:0 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.86);
  padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:2px;
}
.nav-item .nav-ic{width:18px;text-align:center;flex-shrink:0;font-size:14px;}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff;}
.nav-item.active{background:var(--magenta);color:#fff;}
#sidebar .foot{padding:14px 20px 18px;color:rgba(255,255,255,.45);font-size:10.5px;border-top:1px solid rgba(255,255,255,.12);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;
}
#topbar h2{font-size:18px;}
#topbar .top-actions{display:flex;align-items:center;gap:12px;}
#sidebar-toggle{display:none;background:none;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:16px;color:var(--navy);}
.save-indicator{font-size:11px;color:var(--text-soft);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
.save-dot.err{background:var(--red);}
.save-indicator.save-error{color:var(--red);}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.lang-switcher{display:flex;align-items:center;flex-shrink:0;}
.lang-switcher select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  font-family:'Montserrat','Segoe UI',system-ui,sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.2px;
  background-color:var(--cream);color:var(--navy);
  border:1.5px solid var(--navy);border-radius:20px;
  padding:6px 28px 6px 13px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%2300327D'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;
}
.lang-switcher select:hover{border-color:var(--magenta);}
.lang-switcher select:focus{outline:none;border-color:var(--magenta);box-shadow:0 0 0 3px var(--magenta-soft);}
@media(max-width:600px){.lang-switcher select{font-size:11.5px;padding:6px 24px 6px 11px;}}
#content{padding:22px 26px 60px;flex:1;}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:140;}

@media(max-width:880px){
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .22s ease;z-index:150;box-shadow:0 0 30px rgba(0,0,0,.35);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-backdrop.open{display:block;}
  #sidebar-toggle{display:inline-flex;align-items:center;justify-content:center;}
  #content{padding:16px 14px 60px;}
  #topbar{padding:10px 14px;}
}

/* ---------- Grid / layout helpers ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:1050px){.two-col{grid-template-columns:minmax(0,1fr);}}
@media(max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:minmax(0,1fr);}}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.spacer{flex:1;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);}
.card.tight{padding:14px;}
.section-title{font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px;letter-spacing:.2px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.card-header h3{font-size:15px;}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-card .label{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-soft);}
.stat-card .value{font-size:23px;font-weight:700;color:var(--navy);}
.stat-card .value.neg{color:var(--red);}
.stat-card .sub{font-size:11.5px;color:var(--text-soft);}
.stat-card .sub.up{color:var(--green);}
.stat-card .sub.down{color:var(--red);}
.stat-card .icon-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:2px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;
  font-size:13px;font-weight:600;border:1px solid transparent;transition:filter .12s ease;white-space:nowrap;
}
.btn:active{filter:brightness(.94);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--magenta);color:#fff;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-outline{background:#fff;border-color:var(--border);color:var(--navy);}
.btn-outline:hover{border-color:var(--navy-2);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text-soft);}
.btn-ghost:hover{background:#00000008;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-icon{padding:7px 9px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}

/* ---------- Forms ---------- */
label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;color:var(--text);background:#fff;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2);}
textarea{resize:vertical;min-height:70px;}
.field{margin-bottom:13px;}
.field.error input,.field.error select,.field.error textarea{border-color:var(--red);}
.field-error{color:var(--red);font-size:11.5px;margin-top:4px;font-weight:600;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:600px){.form-grid,.form-grid.cols-3{grid-template-columns:1fr;}}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.checkbox-row input{width:auto;}
.input-prefix{position:relative;}
.input-prefix span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:13px;}
.input-prefix input{padding-left:24px;}
.form-errors{background:var(--red-soft);border:1px solid #F0C4CC;color:var(--red);padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:12px;}
.form-errors ul{margin:4px 0 0;padding-left:18px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table.data{width:100%;border-collapse:collapse;font-size:12.8px;min-width:560px;}
table.data th{text-align:left;background:#FAF8F3;color:var(--navy);font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data td{padding:10px 12px;border-bottom:1px solid #F0EEE6;vertical-align:middle;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:#FAF9F5;}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums;}
.amount-pos{color:var(--green);font-weight:700;}
.amount-neg{color:var(--red);font-weight:700;}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.table-toolbar .search{flex:1;min-width:160px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

/* ---------- Badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.6px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-navy{background:#E6EDF8;color:var(--navy);}
.badge-magenta{background:var(--magenta-soft);color:var(--magenta);}
.badge-gray{background:#EEEBE2;color:var(--text-soft);}
.pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-soft);}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Progress ---------- */
.progress-track{background:#EEEBE2;border-radius:20px;height:9px;overflow:hidden;}
.progress-fill{height:100%;background:var(--magenta);border-radius:20px;transition:width .3s ease;}
.progress-fill.green{background:var(--green);}
.progress-fill.amber{background:var(--amber);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:46px 20px;color:var(--text-soft);}
.empty-state .emoji{font-size:34px;margin-bottom:10px;}
.empty-state h4{color:var(--navy);font-size:14.5px;margin-bottom:6px;}
.empty-state p{font-size:12.5px;margin:0 0 14px;}

/* ---------- Charts ---------- */
.chart-card canvas{max-height:280px;}
.chart-wrap{position:relative;height:270px;}
#chart-cashflow-trend{background:#F5F3EE;border-radius:8px;}
.chart-wrap.tall{height:320px;}
.chart-wrap.small{height:200px;}
.chart-legend-note{font-size:11px;color:var(--text-soft);margin-top:8px;}


/* ---------- Dashboard visual-first layout (Phase 2) ---------- */
.dashboard-visual-stack{display:flex;flex-direction:column;gap:16px;}
.dashboard-welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"copy actions" "copy filter";gap:10px 18px;align-items:center;padding:20px 22px;background:linear-gradient(135deg,#fff 0%,#F8FAFD 100%);border-color:#DCE4EF;}
.dashboard-welcome-copy{grid-area:copy;min-width:0;}
.dashboard-welcome-eyebrow{font-size:11px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--magenta);margin-bottom:5px;}
.dashboard-welcome h1{margin:0;color:var(--navy);font-size:23px;line-height:1.2;}
.dashboard-welcome .hint{margin-top:5px;}
.dashboard-welcome-actions{grid-area:actions;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.dashboard-welcome-filter{grid-area:filter;justify-self:end;}
.dashboard-welcome-filter .range-filter{margin:0;}
.dashboard-main-charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
.dashboard-main-charts .chart-card--wide{grid-column:1 / -1;}
.dashboard-kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.dashboard-kpi-primary .stat-card{min-height:92px;}
.dashboard-kpi-secondary{grid-template-columns:repeat(2,minmax(0,1fr));}
.dashboard-kpi-secondary .stat-card{min-height:76px;}
.dashboard-cashflow-card{min-width:0;}
.dashboard-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.dashboard-chart-grid .chart-card{min-width:0;}
.dashboard-chart-grid .chart-card:last-child{grid-column:1 / -1;}
.dashboard-alerts{display:flex;flex-direction:column;gap:0;}
.dashboard-alerts .alert{margin-bottom:10px;}
.dashboard-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.dashboard-intro .section-title{margin-bottom:2px;}
.dashboard-intro .hint{margin-top:0;}
@media(max-width:1050px){
  .dashboard-welcome{grid-template-columns:1fr;grid-template-areas:"copy" "actions" "filter";}
  .dashboard-welcome-actions{justify-content:flex-start;}
  .dashboard-welcome-filter{justify-self:start;}
  .dashboard-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:720px){
  .dashboard-main-charts,.dashboard-chart-grid{grid-template-columns:minmax(0,1fr);}
  .dashboard-main-charts .chart-card--wide{grid-column:auto;}
  .dashboard-chart-grid .chart-card:last-child{grid-column:auto;}
  .dashboard-kpi-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .dashboard-welcome{padding:16px;}
}
@media(max-width:480px){
  .dashboard-kpi-grid,.dashboard-kpi-secondary{grid-template-columns:minmax(0,1fr);}
  .dashboard-welcome-actions .btn{flex:1 1 100%;}
}
/* ---------- Alerts / callouts ---------- */
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:11px;border:1px solid transparent;font-size:12.6px;margin-bottom:10px;align-items:flex-start;}
.alert .ic{font-size:16px;line-height:1;}
.alert-danger{background:var(--red-soft);border-color:#F0C4CC;color:#7A1B2C;}
.alert-warning{background:var(--amber-soft);border-color:#EBD8AD;color:#6B4E10;}
.alert-info{background:#E6EDF8;border-color:#C9D8F2;color:var(--navy);}
.alert strong{display:block;margin-bottom:1px;}

/* ---------- Modal ---------- */
#modal-root{display:none;position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
#modal-root.open{display:flex;}
#modal-box{background:#fff;border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
#modal-box.wide{max-width:760px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.modal-header h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--text-soft);padding:2px 6px;border-radius:7px;}
.modal-close:hover{background:#00000010;}
.modal-body{padding:20px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff;}
@media(max-width:600px){.modal-footer{flex-direction:column-reverse;} .modal-footer .btn{width:100%;}}

/* ---------- Toasts ---------- */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:10px;font-size:12.6px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.toast.warning{background:var(--amber);}
@media(max-width:600px){#toast-root{left:14px;right:14px;bottom:14px;max-width:none;}}

/* ---------- Welcome gate ---------- */
#welcome-gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,#001F52 100%);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.welcome-card{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.welcome-card h2{font-size:22px;margin-bottom:6px;}
.welcome-card .sub{color:var(--text-soft);font-size:13px;margin-bottom:22px;}
.welcome-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
@media(max-width:560px){.welcome-choice{grid-template-columns:1fr;}}
.welcome-option{border:2px solid var(--border);border-radius:14px;padding:18px;text-align:left;background:#fff;transition:border-color .15s ease;}
.welcome-option:hover{border-color:var(--magenta);}
.welcome-option .opt-icon{font-size:22px;margin-bottom:8px;}
.welcome-option h4{color:var(--navy);font-size:14.5px;margin-bottom:5px;}
.welcome-option p{font-size:12px;color:var(--text-soft);margin:0;}
.welcome-disclaimer{font-size:10.8px;color:var(--text-soft);margin-top:18px;line-height:1.5;border-top:1px solid var(--border);padding-top:14px;}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.muted{color:var(--text-soft);}
.mono{font-variant-numeric:tabular-nums;}
.kbd-hint{font-size:11px;color:var(--text-soft);}
.disclaimer-box{background:#FAF8F3;border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:11.6px;color:var(--text-soft);line-height:1.6;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:10px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:12.8px;font-weight:600;color:var(--text-soft);white-space:nowrap;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--magenta);}
.avatar-circle{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

@media(max-width:600px){
  .grid-4,.grid-3,.grid-2,.two-col{grid-template-columns:minmax(0,1fr);}
  #topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
  .table-toolbar{flex-direction:column;align-items:stretch;}
  .card{padding:15px;}
  table.data{min-width:480px;}
}
@media print{
  #sidebar,#topbar,#toast-root,.no-print{display:none!important;}
  #content{padding:0;}
}



/* Sales Tax UI — scoped to New/Edit Sale and sale summaries */
.sale-tax-section{
  margin-top:14px;
  padding:14px;
  border:1px solid #E5E1D8;
  border-radius:12px;
  background:#FAF8F3;
}
.sale-tax-section .section-title{margin-bottom:10px;}
.sale-tax-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.sale-tax-summary{margin-top:14px;padding:14px;border:1px solid #E5E1D8;border-radius:12px;background:#FFFFFF;}
.sale-tax-summary .summary-row{display:flex;justify-content:space-between;gap:16px;padding:5px 0;}
.sale-tax-summary .summary-row.total{margin-top:6px;padding-top:10px;border-top:1px solid #E5E1D8;font-size:15px;}
.sale-tax-summary .tax-row strong{color:var(--magenta);}
.sale-tax-note{margin:8px 0 0;font-size:11.5px;color:var(--muted,#616B7A);}
@media(max-width:720px){
  .sale-tax-grid{grid-template-columns:1fr;}
}


  /* Inventory adjustments */
  .inv-adjust-positive{color:var(--green);}
  .inv-adjust-negative{color:var(--red);}

<div id="app">
  <div id="sidebar-backdrop"></div>
  <nav id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="logo-row">
        <h1>Small Business<br>Manager Pro</h1>
      </div>
    </div>
    <div id="nav-container" style="flex:1;overflow-y:auto;padding-bottom:10px;"></div>
    <div class="foot">Small Business Manager Pro &middot; All data stored locally on this device</div>
  </nav>
  <div id="main">
    <div id="topbar">
      <div class="row">
        <button id="sidebar-toggle" aria-label="Open navigation" data-i18n-aria="shell.openNavigation">&#9776;</button>
        <h2 id="page-title">Dashboard</h2>
      </div>
      <div class="top-actions">
        <span id="save-indicator" class="save-indicator"><span class="save-dot ok"></span> Saved</span>
        <button class="btn btn-accent btn-sm" id="profile-btn">Profile</button>
        <div class="lang-switcher">
          <label for="lang-select" class="visually-hidden">Language / Idioma / Idioma / Langue / Sprache</label>
          <select id="lang-select" aria-label="Language / Idioma / Idioma / Langue / Sprache">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
    </div>
    <main id="content" role="main"></main>
  </div>
</div>

<div id="modal-root" aria-hidden="true">
  <div id="modal-box" role="dialog" aria-modal="true"></div>
</div>
<div id="toast-root" aria-live="polite"></div>
<div id="welcome-gate" style="display:none;"></div>

let CURRENT_LANG = 'en';
(function loadLang(){
  try{
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if(saved && SUPPORTED_LANGS.indexOf(saved) !== -1) CURRENT_LANG = saved;
  }catch(e){ console.warn('localStorage unavailable for language preference', e); }
})();
function t(key, vars){
  const table = I18N[CURRENT_LANG] || I18N.en;
  let str = (table && table[key] !== undefined) ? table[key] : ((I18N.en && I18N.en[key] !== undefined) ? I18N.en[key] : key);
  if(vars){ Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); }); }
  return str;
}
/* Simple one/other pluralization — sufficient for the counts this app displays. */
function tc(baseKey, n, vars){
  const suffix = (Number(n) === 1) ? '.one' : '.other';
  return t(baseKey + suffix, Object.assign({n:n}, vars||{}));
}
function currentLangLocale(){ return LANG_LOCALE[CURRENT_LANG] || 'en-US'; }
function setLanguage(lang){
  if(SUPPORTED_LANGS.indexOf(lang) === -1) return;
  CURRENT_LANG = lang;
  try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){ console.warn('Could not persist language preference', e); }
  document.documentElement.lang = lang;
  const sel = document.getElementById('lang-select');
  if(sel && sel.value !== lang) sel.value = lang;
  if(typeof SAVE_OK !== 'undefined') setSaveIndicator(SAVE_OK);
  if(typeof refreshStaticChromeText === 'function') refreshStaticChromeText();
  renderApp();
}

const STORAGE_KEY = 'sbmp_data_v1';
const APP_VERSION = 1;

/* ---------- ID / basic utils ---------- */
function uid(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function sum(arr, fn){ return arr.reduce((a,x)=> a + (fn ? (Number(fn(x))||0) : (Number(x)||0)), 0); }
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function safeNum(n, fallback){ const v = Number(n); return (isFinite(v) && !isNaN(v)) ? v : (fallback||0); }
function groupBy(arr, fn){
  const m = new Map();
  arr.forEach(x=>{ const k = fn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){
  let t = null;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}
function bindSearchInput(el, selector, state, mountFn, delay=200){
  const input = el.querySelector(selector);
  if(!input) return;
  input.addEventListener('input', debounce(e=>{
    const searchInput = e.target;
    const hadFocus = document.activeElement === searchInput;
    const selectionStart = searchInput.selectionStart;
    const selectionEnd = searchInput.selectionEnd;
    state.q = searchInput.value;
    mountFn(el);
    if(hadFocus){
      const restoredInput = el.querySelector(selector);
      if(restoredInput){
        restoredInput.focus({preventScroll:true});
        const caretStart = Math.min(selectionStart == null ? restoredInput.value.length : selectionStart, restoredInput.value.length);
        const caretEnd = Math.min(selectionEnd == null ? caretStart : selectionEnd, restoredInput.value.length);
        restoredInput.setSelectionRange(caretStart, caretEnd);
      }
    }
  }, delay));
}

/* ---------- Formatters (respect Settings) ---------- */
function currencySymbol(){ return (STORE.state.settings && STORE.state.settings.currencySymbol) || '$'; }
function fmtMoney(n){
  const v = safeNum(n, 0);
  const neg = v < 0;
  const abs = Math.abs(v);
  const str = abs.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg ? '-' : '') + currencySymbol() + str;
}
function fmtNum(n, decimals){
  const v = safeNum(n, 0);
  return v.toLocaleString(undefined, {minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||0});
}
function fmtPct(n, decimals){
  const v = safeNum(n, 0);
  return v.toFixed(decimals===undefined?1:decimals) + '%';
}
function fmtDate(isoDate){
  if(!isoDate) return '—';
  const fmt = (STORE.state.settings && STORE.state.settings.dateFormat) || 'MM/DD/YYYY';
  const parts = String(isoDate).slice(0,10).split('-');
  if(parts.length !== 3) return String(isoDate);
  const [y,m,d] = parts;
  if(fmt === 'DD/MM/YYYY') return `${d}/${m}/${y}`;
  if(fmt === 'YYYY-MM-DD') return `${y}-${m}-${d}`;
  return `${m}/${d}/${y}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    return fmtDate(d.toISOString().slice(0,10)) + ' ' + d.toLocaleTimeString(currentLangLocale(),{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return String(iso); }
}
function monthKey(isoDate){ return String(isoDate).slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString(currentLangLocale(),{month:'short', year:'numeric'});
}

/* ---------- Default state shape (single source of truth) ---------- */

const DEFAULT_PAYMENT_METHODS = ['Bank Transfer','Cash','PayPal','Etsy Payments','Stripe','Other'];

function seedCategories(){

function seedPaymentMethods(){

function defaultState(){

const STATE_ARRAY_KEYS = ['products','customers','suppliers','sales','saleItems','purchases','inventoryAdjustments','expenses','fees','otherIncome','goals','paymentMethods','categories'];
const REQUIRED_STATE_ARRAY_KEYS = STATE_ARRAY_KEYS.filter(k=>k!=='inventoryAdjustments');

/* ---------- Backup validation ---------- */
function validateStateShape(obj){
  const errors = [];
  if(!obj || typeof obj !== 'object') return [t('backup.invalidData')];
  if(!obj.settings || typeof obj.settings !== 'object') errors.push(t('backup.missingSettings'));
  REQUIRED_STATE_ARRAY_KEYS.forEach(k=>{
    if(!Array.isArray(obj[k])) errors.push(t('backup.missingList',{k:k}));
  });
  // inventoryAdjustments was added after the original backup schema; migrate
  // older backups without rejecting otherwise valid historical data.
  if(obj.inventoryAdjustments !== undefined && !Array.isArray(obj.inventoryAdjustments)){
    errors.push(t('backup.missingList',{k:'inventoryAdjustments'}));
  }
  if(errors.length) return errors;
  // reference integrity spot-checks (non-fatal fields tolerated, but ids must be strings)
  const idSets = {};
  STATE_ARRAY_KEYS.forEach(k=>{ idSets[k] = new Set((obj[k]||[]).map(r=>r && r.id)); });
  obj.saleItems.forEach((si,i)=>{
    if(!si.id) errors.push(t('backup.saleItemMissingId',{n:i+1}));
    if(si.saleId && !idSets.sales.has(si.saleId)) errors.push(t('backup.saleItemBadRef',{id:si.id||'#'+(i+1)}));
  });
  obj.sales.forEach((s,i)=>{ if(!s.id) errors.push(t('backup.saleMissingId',{n:i+1})); });
  return errors;
}

/* ---------- Central store ---------- */
const STORE = {
  state: null,
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }
    catch(e){ console.warn('localStorage unavailable', e); }
    if(raw){
      let parsed = null;
      try{ parsed = JSON.parse(raw); }
      catch(e){ console.warn('Stored data was corrupted JSON, starting fresh.', e); }
      if(parsed && validateStateShape(parsed).length === 0){
        this.state = migrateState(parsed);
        return;
      }
    }
    this.state = defaultState();
  },
  save(){
    try{
      this.state.meta.lastSaved = nowISO();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      setSaveIndicator(true);
    }catch(e){
      console.error('Failed to save to localStorage', e);
      setSaveIndicator(false);
      toast(t('backup.storageFullWarning'), 'error');
    }
  },
  mutate(fn){
    fn(this.state);
    this.save();
    this.render();
  },
  render(){ renderApp(); }
};

function migrateState(obj){
  // forward-compatible: fill any missing collections/fields without discarding user data
  const base = defaultState();
  const out = Object.assign({}, base, obj);
  STATE_ARRAY_KEYS.forEach(k=>{ if(!Array.isArray(out[k])) out[k] = base[k]; });
  out.settings = Object.assign({}, base.settings, obj.settings||{});
  out.meta = Object.assign({}, base.meta, obj.meta||{});
  if(!out.categories.length) out.categories = base.categories;
  if(!out.paymentMethods.length) out.paymentMethods = base.paymentMethods;
  if(!Array.isArray(out.inventoryAdjustments)) out.inventoryAdjustments = [];
  // Payment Status is a separate sale attribute from the existing order status
  // and payment method. Legacy sales default to Paid so existing revenue/cash
  // recognition remains unchanged.
  const PAYMENT_STATUSES = ['Paid','Partially Paid','Unpaid'];
  out.sales.forEach(s=>{
    if(!PAYMENT_STATUSES.includes(s.paymentStatus)) s.paymentStatus = 'Paid';
    if(!SALES_CHANNELS.includes(s.salesChannel)) s.salesChannel = 'Other';
    if(!Array.isArray(s.refunds)) s.refunds = [];
    // Convert legacy full-refund snapshots into the new authoritative refund ledger.
    // IMPORTANT: migration runs before STORE.state is assigned, so it must NEVER call
    // helpers such as itemsForSale/orderCOGS/orderSalesTax that read STORE.state.
    // Doing so caused startup to throw on existing 4_8 data containing a refunded sale,
    // which stopped renderApp() before the sidebar/menu could be populated.
    if(s.status === 'Refunded' && s.refunds.length === 0 && safeNum(s.refundAmount) > 0){
      const legacyItems = out.saleItems.filter(i=>i.saleId===s.id);
      const legacyTaxable = round2(legacyItems.reduce((a,i)=>a + safeNum(i.quantity) * safeNum(i.unitPrice) - safeNum(i.discount), 0));
      const storedTax = Number(s.taxAmount);
      const legacyTax = round2(isFinite(storedTax) && !isNaN(storedTax) && storedTax >= 0
        ? storedTax
        : legacyTaxable * safeNum(s.taxRate) / 100);
      const legacyCOGS = round2(legacyItems.reduce((a,i)=>a + safeNum(i.quantity) * safeNum(i.unitCost), 0));
      s.refunds = [{
        id: uid('refund'),
        date: s.refundedAt || todayISO(),
        amount: round2(s.refundAmount),
        revenueReduction: round2(Math.max(0, safeNum(s.refundAmount) - legacyTax)),
        salesTaxReversal: legacyTax,
        shippingRefund: safeNum(s.shippingCharged),
        cogsReversal: legacyCOGS,
        items: legacyItems.map(i=>({productId:i.productId, quantity:safeNum(i.quantity)})),
        note: 'Legacy full refund'
      }];
    }
    if(s.refunds.length){
      s.refundAmount = round2(s.refunds.reduce((a,r)=>a+safeNum(r.amount),0));
      const last = s.refunds[s.refunds.length-1];
      if(!s.refundedAt && last.date) s.refundedAt = last.date;
    }
  });
  return out;
}

let SAVE_OK = true;
function setSaveIndicator(ok){
  SAVE_OK = ok;
  const el = document.getElementById('save-indicator');
  if(!el) return;
  if(ok){
    const timeStr = new Date().toLocaleTimeString(currentLangLocale(),{hour:'2-digit',minute:'2-digit'});
    el.innerHTML = `<span class="save-dot ok"></span> ${escapeHtml(t('shell.savedAt',{time:timeStr}))}`;
    el.classList.remove('save-error');
  } else {
    el.innerHTML = `<span class="save-dot err"></span> ${escapeHtml(t('shell.notSaved'))}`;
    el.classList.add('save-error');
  }
}

/* ---------- Generic CRUD helpers (all collections) ---------- */
function addRecord(arrName, record){
  record.id = record.id || uid(arrName);
  record.createdAt = record.createdAt || nowISO();
  record.updatedAt = nowISO();
  STORE.mutate(s => s[arrName].push(record));
  return record.id;
}
function updateRecord(arrName, id, patch){
  STORE.mutate(s=>{
    const rec = s[arrName].find(r=>r.id===id);
    if(rec){ Object.assign(rec, patch, {updatedAt: nowISO()}); }
  });
}
function deleteRecord(arrName, id){
  STORE.mutate(s=>{ s[arrName] = s[arrName].filter(r=>r.id!==id); });
}
function getRecord(arrName, id){
  return (STORE.state[arrName]||[]).find(r=>r.id===id) || null;
}

/* ---------- Validation helpers ---------- */
function isBlank(v){ return v===undefined || v===null || String(v).trim()===''; }
function skuExists(sku, excludeId){
  if(isBlank(sku)) return false;
  const norm = String(sku).trim().toLowerCase();
  return STORE.state.products.some(p => p.id!==excludeId && String(p.sku||'').trim().toLowerCase()===norm);
}
function isValidAmount(v){
  const n = Number(v);
  return isFinite(n) && !isNaN(n) && n >= 0;
}
function isValidDate(v){
  return !isBlank(v) && !isNaN(new Date(v).getTime());
}

/* ============================================================
   CENTRAL CALCULATION ENGINE
   Every module (Dashboard, Reports, P&L, Cash Flow, Charts) must
   call these functions. Never recompute a metric independently
   elsewhere in the app.
   ============================================================ */
'use strict';

/* ---------- Date range resolution ---------- */
function resolveDateRange(key, customStart, customEnd){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = dt => dt.toISOString().slice(0,10);
  const startOfDay = new Date(y,m,d);
  switch(key){
    case 'today': return { start: iso(startOfDay), end: iso(startOfDay) };
    case 'this-week': {
      const dow = startOfDay.getDay(); // 0 Sun
      const monday = new Date(startOfDay); monday.setDate(startOfDay.getDate() - ((dow+6)%7));
      const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
      return { start: iso(monday), end: iso(sunday) };
    }
    case 'this-month': return { start: iso(new Date(y,m,1)), end: iso(new Date(y,m+1,0)) };
    case 'last-month': return { start: iso(new Date(y,m-1,1)), end: iso(new Date(y,m,0)) };
    case 'this-quarter': {
      const q = Math.floor(m/3);
      return { start: iso(new Date(y,q*3,1)), end: iso(new Date(y,q*3+3,0)) };
    }
    case 'this-year': return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
    case 'all': return { start: '0000-01-01', end: '9999-12-31' };
    case 'custom': return { start: customStart || iso(new Date(y,0,1)), end: customEnd || iso(startOfDay) };
    default: return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
  }
}
function inRange(dateStr, start, end){
  if(isBlank(dateStr)) return false;
  const d = String(dateStr).slice(0,10);
  return d >= start && d <= end;
}

/* ---------- Base accessors ---------- */
function activeProducts(){ return STORE.state.products.filter(p=>p.status!=='archived'); }
/* P&L / profit-reporting accessor: only sales CURRENTLY Completed count as realized
   revenue/COGS/profit. Once a sale is Refunded, the whole transaction unwinds and
   stops contributing to profit — this is intentional and correct for P&L purposes. */
function completedSales(range){
  return STORE.state.sales.filter(s => s.status==='Completed' && (!range || inRange(s.date, range.start, range.end)));
}
/* Cash-flow accessor: any sale that ACTUALLY had cash collected — i.e. it reached
   Completed at some point, whether or not it was later refunded (only a previously
   Completed sale can become Refunded). Cash really did arrive on the order's date,
   so cash-flow reporting must keep that inflow on record even after a later refund;
   the refund itself is booked as a separate, dated cash outflow (see calcCashOut).
   This is what keeps a refund from being counted twice (see calcCashOut). */
function cashSettledSales(range){
  return STORE.state.sales.filter(s => (s.status==='Completed' || s.status==='Refunded') && (!range || inRange(s.date, range.start, range.end)));
}
function itemsForSale(saleId){ return STORE.state.saleItems.filter(i=>i.saleId===saleId); }

/* ---------- Line / order level math (single definitions, reused everywhere) ---------- */
function lineGross(item){ return safeNum(item.quantity) * safeNum(item.unitPrice); }
function lineNet(item){ return round2(lineGross(item) - safeNum(item.discount)); }
function lineCOGS(item){ return round2(safeNum(item.quantity) * safeNum(item.unitCost)); }
/* ---------- Sales Tax / order totals (single definitions, reused everywhere) ---------- */
function orderSubtotal(sale){
  return round2(sum(itemsForSale(sale.id), lineGross));
}
function orderDiscount(sale){
  return round2(sum(itemsForSale(sale.id), i=>safeNum(i.discount)));
}
function orderTaxableAmount(sale){
  return round2(sum(itemsForSale(sale.id), lineNet));
}
function rawOrderTax(sale){
  const taxable = orderTaxableAmount(sale);
  const stored = Number(sale && sale.taxAmount);
  if(isFinite(stored) && !isNaN(stored) && stored >= 0) return round2(stored);
  return round2(taxable * safeNum(sale && sale.taxRate) / 100);
}
function refundRecords(sale){
  return Array.isArray(sale && sale.refunds) ? sale.refunds : [];
}
function refundedQuantityByProduct(sale){
  const out = {};
  refundRecords(sale).forEach(r=>(Array.isArray(r.items)?r.items:[]).forEach(i=>{
    out[i.productId] = round2((out[i.productId]||0) + safeNum(i.quantity));
  }));
  return out;
}
function refundedQuantityForItem(sale,item){
  return safeNum(refundedQuantityByProduct(sale)[item.productId]);
}
function refundedRevenueTotal(sale){ return round2(sum(refundRecords(sale),r=>safeNum(r.revenueReduction))); }
function refundedTaxTotal(sale){ return round2(sum(refundRecords(sale),r=>safeNum(r.salesTaxReversal))); }
function refundedShippingTotal(sale){ return round2(sum(refundRecords(sale),r=>safeNum(r.shippingRefund))); }
function refundedAmountTotal(sale){ return round2(sum(refundRecords(sale),r=>safeNum(r.amount))); }
function refundedCOGSTotal(sale){ return round2(sum(refundRecords(sale),r=>safeNum(r.cogsReversal))); }
function orderSalesTax(sale){
  return round2(Math.max(0, rawOrderTax(sale) - refundedTaxTotal(sale)));
}
function orderRevenue(sale){
  /* Sales tax is collected cash, not business revenue. Shipping remains revenue
     under the app's existing revenue model; refunds reduce only the portion actually
     returned to the customer. */
  return round2(Math.max(0, orderTaxableAmount(sale) + safeNum(sale.shippingCharged) - refundedRevenueTotal(sale) - refundedShippingTotal(sale)));
}
function orderGrandTotal(sale){
  return round2(Math.max(0, orderRevenue(sale) + orderSalesTax(sale)));
}
function orderCOGS(sale){
  return round2(Math.max(0, sum(itemsForSale(sale.id), lineCOGS) - refundedCOGSTotal(sale)));
}
function orderUnits(sale){
  const total = sum(itemsForSale(sale.id), i=>safeNum(i.quantity));
  const refunded = sum(refundRecords(sale), r=>sum(Array.isArray(r.items)?r.items:[], i=>safeNum(i.quantity)));
  return Math.max(0, round2(total - refunded));
}

/* ---------- P&L building blocks ---------- */
function calcRevenue(range){ return round2(sum(completedSales(range), orderRevenue)); }
function calcCOGS(range){ return round2(sum(completedSales(range), orderCOGS)); }
function calcGrossProfit(range){ return round2(calcRevenue(range) - calcCOGS(range)); }
function calcOperatingExpenses(range){
  return round2(sum(STORE.state.expenses.filter(e=>!range || inRange(e.date, range.start, range.end)), e=>safeNum(e.amount)));
}
/* Actual shipping paid by the business is separate from shipping charged to the customer. */
function calcActualShippingCost(range){
  return round2(sum(completedSales(range), s=>safeNum(s.actualShippingCost)));
}
function standaloneFeesTotal(range){
  return round2(sum(STORE.state.fees.filter(f=>!range || inRange(f.date, range.start, range.end)), f=>safeNum(f.amount)));
}
/* P&L selling fees: only currently-Completed sales' order-level fee counts (mirrors
   completedSales — once refunded, the whole order unwinds for profit purposes). */
function calcSellingFees(range){
  const fromSales = sum(completedSales(range), s=>safeNum(s.sellingFee));
  return round2(fromSales + standaloneFeesTotal(range));
}
function calcNetProfit(range){
  return round2(calcGrossProfit(range) - calcOperatingExpenses(range) - calcActualShippingCost(range) - calcSellingFees(range));
}
function calcGrossMarginPct(range){
  const rev = calcRevenue(range);
  return rev > 0 ? round2((calcGrossProfit(range)/rev)*100) : 0;
}
function calcNetMarginPct(range){
  const rev = calcRevenue(range);
  return rev > 0 ? round2((calcNetProfit(range)/rev)*100) : 0;
}
function calcUnitsSold(range){ return sum(completedSales(range), orderUnits); }
function calcOrdersCount(range){ return completedSales(range).length; }
function calcAvgOrderValue(range){
  const n = calcOrdersCount(range);
  return n > 0 ? round2(calcRevenue(range)/n) : 0;
}
function calcOtherIncome(range){
  return round2(sum((STORE.state.otherIncome||[]).filter(o=>!range || inRange(o.date, range.start, range.end)), o=>safeNum(o.amount)));
}

/* ---------- Inventory ---------- */
function inventoryQuantityTotal(){ return sum(activeProducts(), p=>safeNum(p.quantity)); }
function inventoryValueTotal(){ return round2(sum(activeProducts(), p=>safeNum(p.quantity)*safeNum(p.unitCost))); }
function productStockStatus(p){
  const q = safeNum(p.quantity);
  const reorder = safeNum(p.reorderLevel);
  if(q <= 0) return 'Out of Stock';
  if(q <= reorder) return 'Low Stock';
  return 'In Stock';
}
function lowStockProducts(){ return activeProducts().filter(p=>productStockStatus(p)==='Low Stock'); }
function outOfStockProducts(){ return activeProducts().filter(p=>productStockStatus(p)==='Out of Stock'); }

/* ---------- Cash flow ----------
   Cash Flow is deliberately kept separate from Profit & Loss (see completedSales vs.
   cashSettledSales above). Cash In uses cashSettledSales so a sale's original cash
   inflow stays on record on the date it actually happened, even if the order is
   refunded later. The refund is then its own dated cash outflow in calcCashOut. This
   way a refund reduces Net Cash Flow by exactly the amount refunded — once — instead
   of once by the vanished revenue and again by the refund outflow. */
/* Named sub-totals — the ONE place each cash-flow line item is computed. The Cash
   Flow page's breakdown tables call these directly (never recomputing inline) so
   the breakdown always sums to exactly the same Cash In / Cash Out shown above it. */
function grossOrderSalesTax(sale){
  const taxable = orderTaxableAmount(sale);
  const stored = Number(sale && sale.taxAmount);
  if(isFinite(stored) && !isNaN(stored) && stored >= 0) return round2(stored);
  return round2(taxable * safeNum(sale && sale.taxRate) / 100);
}
function grossOrderRevenue(sale){
  return round2(orderTaxableAmount(sale) + safeNum(sale.shippingCharged));
}
function grossOrderGrandTotal(sale){
  return round2(grossOrderRevenue(sale) + grossOrderSalesTax(sale));
}
function calcCashSalesCollected(range){ return round2(sum(cashSettledSales(range), grossOrderGrandTotal)); }
/* Backward-compatible alias: older internal references may call this name. */
function calcCashSalesRevenue(range){ return calcCashSalesCollected(range); }
function calcCashSalesTax(range){ return round2(sum(cashSettledSales(range), grossOrderSalesTax)); }
function calcCashOrderFees(range){ return round2(sum(cashSettledSales(range), s=>safeNum(s.sellingFee))); }
function calcActualShippingCash(range){ return round2(sum(cashSettledSales(range), s=>safeNum(s.actualShippingCost))); }
function calcPurchasesCash(range){
  return round2(sum(STORE.state.purchases.filter(p=>!range || inRange(p.date, range.start, range.end)), p=>safeNum(p.quantity)*safeNum(p.unitCost)));
}
function calcRefundsCash(range){
  return round2(sum(STORE.state.sales, sale=>sum(refundRecords(sale).filter(r=>!range || inRange(r.date, range.start, range.end)), r=>safeNum(r.amount))));
}
function calcCashIn(range){
  return round2(calcCashSalesCollected(range) + calcOtherIncome(range));
}
function calcCashOut(range){
  const feesTotal = round2(calcCashOrderFees(range) + standaloneFeesTotal(range));
  return round2(calcPurchasesCash(range) + calcOperatingExpenses(range) + calcActualShippingCash(range) + feesTotal + calcRefundsCash(range));
}
function calcNetCashFlow(range){ return round2(calcCashIn(range) - calcCashOut(range)); }

/* ---------- Monthly / quarterly / annual series ---------- */
function lastNMonthKeys(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.toISOString().slice(0,7));
  }
  return out;
}
function rangeForMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const iso = dt=>dt.toISOString().slice(0,10);
  return { start: iso(new Date(y,m-1,1)), end: iso(new Date(y,m,0)) };
}
function revenueTrend(n){
  return lastNMonthKeys(n).map(k=>({ key:k, label: monthLabel(k), value: calcRevenue(rangeForMonthKey(k)) }));
}
function profitTrend(n){
  return lastNMonthKeys(n).map(k=>({ key:k, label: monthLabel(k), gross: calcGrossProfit(rangeForMonthKey(k)), net: calcNetProfit(rangeForMonthKey(k)) }));
}
function cashFlowTrend(n){
  return lastNMonthKeys(n).map(k=>({ key:k, label: monthLabel(k), inflow: calcCashIn(rangeForMonthKey(k)), outflow: calcCashOut(rangeForMonthKey(k)), net: calcNetCashFlow(rangeForMonthKey(k)) }));
}

/* ---------- Breakdown helpers ---------- */
function expenseBreakdown(range){
  const filtered = STORE.state.expenses.filter(e=>!range || inRange(e.date, range.start, range.end));
  const byCategory = groupBy(filtered, e=>e.category || 'Other');
  return Array.from(byCategory.entries()).map(([category, list])=>({
    category, total: round2(sum(list, e=>safeNum(e.amount)))
  })).sort((a,b)=>b.total-a.total);
}
function topProducts(range, limit){
  const map = new Map();
  completedSales(range).forEach(sale=>{
    itemsForSale(sale.id).forEach(item=>{
      const key = item.productId || item.sku || item.productName;
      if(!map.has(key)) map.set(key, {productId:item.productId, name:item.productName, units:0, revenue:0, cogs:0});
      const rec = map.get(key);
      rec.units += safeNum(item.quantity);
      rec.revenue += lineNet(item);
      rec.cogs += lineCOGS(item);
    });
  });
  const arr = Array.from(map.values()).map(r=>({...r, revenue: round2(r.revenue), cogs: round2(r.cogs), profit: round2(r.revenue-r.cogs)}));
  arr.sort((a,b)=>b.revenue-a.revenue);
  return limit ? arr.slice(0,limit) : arr;
}
function salesByCategory(range){
  const map = new Map();
  completedSales(range).forEach(sale=>{
    itemsForSale(sale.id).forEach(item=>{
      const product = getRecord('products', item.productId);
      const cat = (product && product.category) || 'Uncategorized';
      map.set(cat, (map.get(cat)||0) + lineNet(item));
    });
  });
  return Array.from(map.entries()).map(([category,total])=>({category, total: round2(total)})).sort((a,b)=>b.total-a.total);
}
function inventoryOverview(){
  return activeProducts().map(p=>({
    id:p.id, name:p.name, sku:p.sku, quantity: safeNum(p.quantity),
    value: round2(safeNum(p.quantity)*safeNum(p.unitCost)), status: productStockStatus(p)
  })).sort((a,b)=>a.name.localeCompare(b.name));

/* ---------- Customer / supplier derived metrics ---------- */
function customerStats(customerId){
  const sales = STORE.state.sales.filter(s=>s.customerId===customerId && s.status==='Completed');
  const orderCount = sales.length;
  const totalSpent = round2(sum(sales, orderGrandTotal));
  const lastOrder = sales.reduce((max,s)=> (!max || s.date > max) ? s.date : max, null);
  return { orderCount, totalSpent, lastOrder };
}
function supplierStats(supplierId){
  const purchases = STORE.state.purchases.filter(p=>p.supplierId===supplierId);
  const totalPurchases = round2(sum(purchases, p=>safeNum(p.quantity)*safeNum(p.unitCost)));
  const lastPurchase = purchases.reduce((max,p)=> (!max || p.date > max) ? p.date : max, null);
  return { orderCount: purchases.length, totalPurchases, lastPurchase };
}

/* ---------- Product economics ---------- */
function unitProfit(p){ return round2(safeNum(p.price) - safeNum(p.unitCost)); }
function unitMarginPct(p){ const price = safeNum(p.price); return price>0 ? round2((unitProfit(p)/price)*100) : 0; }
function productInventoryValue(p){ return round2(safeNum(p.quantity) * safeNum(p.unitCost)); }

/* ---------- Goal progress ---------- */
function goalMetricValue(goal, range){
  switch(goal.type){
    case 'revenue': return calcRevenue(range);
    case 'profit': return calcNetProfit(range);
    case 'orders': return calcOrdersCount(range);
    case 'margin': return calcNetMarginPct(range);
    case 'custom': return safeNum(goal.currentValueOverride);
    default: return 0;
  }
}
function goalProgress(goal){
  const start = goal.startDate || (goal.createdAt||'').slice(0,10) || todayISO();
  const end = goal.deadline || todayISO();
  const range = { start, end: end < start ? start : end };
  const current = goalMetricValue(goal, range);
  const target = safeNum(goal.targetValue);
  const pct = target > 0 ? round2((current/target)*100) : (current>0?100:0);
  const now = todayISO();
  let status;
  if(now < start){ status = 'Not Started'; }
  else if(pct >= 100){ status = 'Completed'; }
  else {
    const totalDays = Math.max(1, (new Date(range.end) - new Date(start)) / 86400000);
    const elapsedDays = clamp((new Date(now < range.end ? now : range.end) - new Date(start)) / 86400000, 0, totalDays);
    const expectedPct = (elapsedDays/totalDays) * 100;
    status = pct + 8 >= expectedPct ? 'On Track' : 'Needs Attention';
    if(now > end && pct < 100) status = 'Needs Attention';
  }
  return { current: round2(current), target, pct: clamp(round2(pct),0,999), status, range };
}

/* ---------- Dashboard alerts ---------- */
function buildAlerts(){
  const alerts = [];
  const low = lowStockProducts(), out = outOfStockProducts();
  if(out.length) alerts.push({type:'danger', title:t('alerts.outOfStockTitle'), text:tc('alerts.outOfStockText', out.length), link:'inventory'});
  if(low.length) alerts.push({type:'warning', title:t('alerts.lowStockTitle'), text:tc('alerts.lowStockText', low.length), link:'inventory'});
  const range = resolveDateRange('this-month');
  const netCF = calcNetCashFlow(range);
  if(netCF < 0) alerts.push({type:'danger', title:t('alerts.negativeCashFlowTitle'), text:t('alerts.negativeCashFlowText',{amount:fmtMoney(Math.abs(netCF))}), link:'cashflow'});
  STORE.state.goals.forEach(g=>{
    const p = goalProgress(g);
    if(p.status === 'Needs Attention'){
      alerts.push({type:'warning', title:t('alerts.goalBehindTitle'), text:t('alerts.goalBehindText',{name:g.name, pct:p.pct}), link:'goals'});
    }
  });
  return alerts;
}

/* ================= INVENTORY ADJUSTMENTS ================= */
const INVENTORY_ADJUSTMENT_REASONS = [
  'Opening Stock',
  'Stock Count Correction',
  'Damaged',
  'Lost',
  'Found',
  'Other'
];

function validateInventoryAdjustmentInput(data){
  const errors = [];
  if(isBlank(data.productId) || !getRecord('products', data.productId)) errors.push(t('val.adjustmentSelectProduct'));
  if(!isValidDate(data.date)) errors.push(t('val.adjustmentValidDate'));
  const adjustmentQty = Number(data.quantityChange);
  if(!isFinite(adjustmentQty) || isNaN(adjustmentQty) || adjustmentQty === 0) errors.push(t('val.adjustmentQuantityNonZero'));
  if(INVENTORY_ADJUSTMENT_REASONS.indexOf(data.reason) === -1) errors.push(t('val.adjustmentReasonRequired'));
  return errors;
}

function createInventoryAdjustment(data){
  const errors = validateInventoryAdjustmentInput(data);
  if(errors.length) return {ok:false, errors};
  const id = uid('iadj');
  STORE.mutate(s=>{
    const rec = {
      id,
      productId:data.productId,
      date:data.date,
      quantityChange:safeNum(data.quantityChange),
      reason:data.reason,
      note:data.note||'',
      createdAt:nowISO(),
      updatedAt:nowISO()
    };
    s.inventoryAdjustments.push(rec);
    const product = s.products.find(p=>p.id===rec.productId);
    if(product) product.quantity = safeNum(product.quantity) + rec.quantityChange;
  });
  return {ok:true, id};
}

function updateInventoryAdjustment(id, data){
  const existing = getRecord('inventoryAdjustments', id);
  if(!existing) return {ok:false, errors:[t('val.adjustmentNotFound')]};
  const errors = validateInventoryAdjustmentInput(data);
  if(errors.length) return {ok:false, errors};
  STORE.mutate(s=>{
    const rec = s.inventoryAdjustments.find(a=>a.id===id);
    if(!rec) return;
    const oldProduct = s.products.find(p=>p.id===rec.productId);
    if(oldProduct) oldProduct.quantity = safeNum(oldProduct.quantity) - safeNum(rec.quantityChange);

    rec.productId = data.productId;
    rec.date = data.date;
    rec.quantityChange = safeNum(data.quantityChange);
    rec.reason = data.reason;
    rec.note = data.note||'';
    rec.updatedAt = nowISO();

    const newProduct = s.products.find(p=>p.id===rec.productId);
    if(newProduct) newProduct.quantity = safeNum(newProduct.quantity) + rec.quantityChange;
  });
  return {ok:true};
}

function deleteInventoryAdjustment(id){
  STORE.mutate(s=>{
    const rec = s.inventoryAdjustments.find(a=>a.id===id);
    if(!rec) return;
    const product = s.products.find(p=>p.id===rec.productId);
    if(product) product.quantity = safeNum(product.quantity) - safeNum(rec.quantityChange);
    s.inventoryAdjustments = s.inventoryAdjustments.filter(a=>a.id!==id);
  });
}

      quantity: safeNum(data.quantity), unitCost: safeNum(data.unitCost), paymentMethodId:data.paymentMethodId||'',
      notes:data.notes||'', createdAt: nowISO(), updatedAt: nowISO() };
    s.purchases.push(rec);

function updatePurchaseRecord(id, data){
  const errors = validatePurchaseInput(data);
  if(errors.length) return {ok:false, errors};
  STORE.mutate(s=>{
    const rec = s.purchases.find(p=>p.id===id);
    if(!rec) return;
    const product = s.products.find(p=>p.id===rec.productId);

    rec.date=data.date; rec.supplierId=data.supplierId||''; rec.productId=data.productId;
    rec.quantity=safeNum(data.quantity); rec.unitCost=safeNum(data.unitCost);
    rec.paymentMethodId=data.paymentMethodId||''; rec.notes=data.notes||''; rec.updatedAt=nowISO();
    const newProduct = s.products.find(p=>p.id===rec.productId);
    if(newProduct) newProduct.quantity = safeNum(newProduct.quantity) + rec.quantity; // apply new
  });
  return {ok:true};
}

    const rec = s.purchases.find(p=>p.id===id);
    if(!rec) return;

/* ================= SALES / ORDERS ================= */
const SALE_STATUSES = ['New','Processing','Shipped','Completed','Cancelled','Refunded'];
const SALES_CHANNELS = ['Etsy','Shopify','Website','Instagram','Facebook','Market/Fair','Other'];

function nextOrderNo(){
  const n = STORE.state.sales.length + 1;
  return 'ORD-' + String(n).padStart(4,'0');
}
/* Requested quantities are aggregated PER PRODUCT before comparing to stock on hand —
   two separate lines for the same product (e.g. 3 + 3 against 5 in stock) must be
   checked against their combined total, not pass individually and silently oversell. */
function checkStockForItems(items){
  const shortages = [];
  const requestedByProduct = {};
  items.forEach(it=>{ requestedByProduct[it.productId] = (requestedByProduct[it.productId]||0) + safeNum(it.quantity); });
  Object.keys(requestedByProduct).forEach(productId=>{
    const product = getRecord('products', productId);
    const available = product ? safeNum(product.quantity) : 0;
    const requested = requestedByProduct[productId];
    if(requested > available){
      shortages.push({ productId, name: product?product.name:t('common.unknownProduct'), available, requested });
    }
  });
  return shortages;
}
function validateSaleInput(header, items){
  const errors = [];
  if(!isValidDate(header.date)) errors.push(t('val.enterValidOrderDate'));
  if(header.shippingCharged!==undefined && header.shippingCharged!==null && header.shippingCharged!=='' && !isValidAmount(header.shippingCharged)) errors.push(t('val.shippingChargedInvalid'));
  if(header.actualShippingCost!==undefined && header.actualShippingCost!==null && header.actualShippingCost!=='' && !isValidAmount(header.actualShippingCost)) errors.push(t('val.actualShippingCostInvalid'));
  if(header.sellingFee!==undefined && header.sellingFee!==null && header.sellingFee!=='' && !isValidAmount(header.sellingFee)) errors.push(t('val.sellingFeeInvalid'));
  if(header.taxRate!==undefined && header.taxRate!==null && header.taxRate!=='' &&
     (!isValidAmount(header.taxRate) || safeNum(header.taxRate) > 100)) errors.push(t('val.salesTaxRateInvalid'));
  if(!items || !items.length) errors.push(t('val.addAtLeastOneLine'));
  (items||[]).forEach((it,i)=>{
    if(isBlank(it.productId)) errors.push(t('val.lineChooseProduct',{n:i+1}));
    if(!isValidAmount(it.quantity) || safeNum(it.quantity) <= 0) errors.push(t('val.lineQuantityGreaterThanZero',{n:i+1}));
    if(!isValidAmount(it.unitPrice)) errors.push(t('val.lineUnitPriceInvalid',{n:i+1}));
    if(!isValidAmount(it.discount)) errors.push(t('val.lineDiscountInvalid',{n:i+1}));
    else if(isValidAmount(it.quantity) && isValidAmount(it.unitPrice) && safeNum(it.discount) > round2(safeNum(it.quantity)*safeNum(it.unitPrice))) errors.push(t('val.lineDiscountExceedsTotal',{n:i+1}));
  });
  return errors;
}
/* Creates the order. If initial status is 'Completed', effects are applied immediately
   (unless insufficient stock and forceOversell is not set — caller should stock-check first). */
function createSale(header, items, opts){
  opts = opts || {};
  const errors = validateSaleInput(header, items);
  if(errors.length) return {ok:false, errors};
  const status = SALE_STATUSES.includes(header.status) ? header.status : 'New';
  if(status === 'Completed' && !opts.forceOversell){
    const shortages = checkStockForItems(items);
    if(shortages.length) return {ok:false, shortages};
  }
  const saleId = uid('sale');
  STORE.mutate(s=>{
    const taxableAmount = round2(sum(items, lineNet));
    const taxRate = safeNum(header.taxRate);
    const taxAmount = round2(taxableAmount * taxRate / 100);
    const sale = {
      id: saleId, orderNo: header.orderNo || nextOrderNo(), date: header.date,
      customerId: header.customerId||'', paymentMethodId: header.paymentMethodId||'',
      paymentStatus: ['Paid','Partially Paid','Unpaid'].includes(header.paymentStatus) ? header.paymentStatus : 'Paid',
      salesChannel: SALES_CHANNELS.includes(header.salesChannel) ? header.salesChannel : 'Other',
      status, shippingCharged: safeNum(header.shippingCharged), actualShippingCost: safeNum(header.actualShippingCost), sellingFee: safeNum(header.sellingFee),
      taxRate, taxAmount, taxableAmount,
      notes: header.notes||'', effectsApplied:false, refundedAt:null, refundAmount:0, refunds:[],
      createdAt: nowISO(), updatedAt: nowISO()
    };
    s.sales.push(sale);
    items.forEach(it=>{
      const product = s.products.find(p=>p.id===it.productId);
      s.saleItems.push({
        id: uid('item'), saleId, productId: it.productId,
        sku: product?product.sku:'', productName: product?product.name:'(deleted product)',
        quantity: safeNum(it.quantity), unitPrice: safeNum(it.unitPrice),
        unitCost: product? safeNum(product.unitCost) : 0, // snapshot at time of sale — protects historical COGS
        discount: safeNum(it.discount)
      });
    });
    if(status === 'Completed'){
      items.forEach(it=>{
        const product = s.products.find(p=>p.id===it.productId);
        if(product) product.quantity = safeNum(product.quantity) - safeNum(it.quantity);
      });
      sale.effectsApplied = true;
    }
  });
  return {ok:true, id:saleId};
}
/* Edits header fields + fully replaces line items. If the order is currently Completed,
   effects are reversed first and, if it remains Completed, reapplied against the new lines. */
function updateSaleRecord(id, header, items, opts){
  opts = opts || {};
  const existing = getRecord('sales', id);
  if(!existing) return {ok:false, errors:[t('val.orderNotFound')]};
  // Refunded and Cancelled are terminal states — editing their contents after the
  // fact would let stale cash/inventory snapshots (e.g. refundAmount) drift out of
  // sync with the line items. Create a new sale instead of editing a closed one.
  if(existing.status === 'Refunded'){
    return {ok:false, errors:[t('val.orderRefundedNoEdit')]};
  }
  if(existing.status === 'Cancelled'){
    return {ok:false, errors:[t('val.orderCancelledNoEdit')]};
  }
  const errors = validateSaleInput(header, items);
  if(errors.length) return {ok:false, errors};
  const wasApplied = !!existing.effectsApplied;
  const newStatus = SALE_STATUSES.includes(header.status) ? header.status : existing.status;
  const refundedByProduct = refundedQuantityByProduct(existing);
  if(existing.refunds && existing.refunds.length && newStatus !== 'Completed'){
    return {ok:false, errors:[t('sales.partialRefundStatusLock')]};
  }
  if(existing.refunds && existing.refunds.length){
    for(const productId of Object.keys(refundedByProduct)){
      const requested = items.filter(it=>it.productId===productId).reduce((a,it)=>a+safeNum(it.quantity),0);
      if(requested + 1e-9 < refundedByProduct[productId]) return {ok:false, errors:[t('sales.partialRefundInvalidQty')]};
    }
  }
  if(newStatus === 'Completed' && !opts.forceOversell){
    // stock check must account for this order's own currently-held units being released first,
    // and — like checkStockForItems — must aggregate requested quantities per product so that
    // multiple lines for the same product can't each pass individually and collectively oversell.
    const releaseMap = {};
    if(wasApplied) itemsForSale(id).forEach(it=>{ releaseMap[it.productId] = (releaseMap[it.productId]||0) + safeNum(it.quantity); });
    const requestedByProduct = {};
    items.forEach(it=>{ requestedByProduct[it.productId] = (requestedByProduct[it.productId]||0) + safeNum(it.quantity); });
    const shortages = [];
    Object.keys(requestedByProduct).forEach(productId=>{
      const product = getRecord('products', productId);
      const available = (product?safeNum(product.quantity):0) + (releaseMap[productId]||0);
      const requested = requestedByProduct[productId];
      if(requested > available) shortages.push({productId, name: product?product.name:t('common.unknownProduct'), available, requested});
    });
    if(shortages.length) return {ok:false, shortages};
  }
  STORE.mutate(s=>{
    const sale = s.sales.find(x=>x.id===id);
    if(!sale) return;
    if(wasApplied){
      itemsForSale(id).forEach(it=>{
        const product = s.products.find(p=>p.id===it.productId);
        const refundedQty = safeNum(refundedByProduct[it.productId]);
        const netHeld = Math.max(0, safeNum(it.quantity) - refundedQty);
        if(product) product.quantity = safeNum(product.quantity) + netHeld;
      });
    }
    s.saleItems = s.saleItems.filter(i=>i.saleId!==id);
    items.forEach(it=>{
      const product = s.products.find(p=>p.id===it.productId);
      s.saleItems.push({
        id: uid('item'), saleId:id, productId: it.productId,
        sku: product?product.sku:'', productName: product?product.name:'(deleted product)',
        quantity: safeNum(it.quantity), unitPrice: safeNum(it.unitPrice),
        unitCost: product? safeNum(product.unitCost) : 0,
        discount: safeNum(it.discount)
      });
    });
    const taxableAmount = round2(sum(items, lineNet));
    const taxRate = safeNum(header.taxRate);
    const taxAmount = round2(taxableAmount * taxRate / 100);
    sale.date = header.date; sale.customerId = header.customerId||''; sale.paymentMethodId = header.paymentMethodId||'';
    sale.paymentStatus = ['Paid','Partially Paid','Unpaid'].includes(header.paymentStatus) ? header.paymentStatus : (sale.paymentStatus || 'Paid');
    sale.salesChannel = SALES_CHANNELS.includes(header.salesChannel) ? header.salesChannel : (SALES_CHANNELS.includes(sale.salesChannel) ? sale.salesChannel : 'Other');
    sale.shippingCharged = safeNum(header.shippingCharged); sale.actualShippingCost = safeNum(header.actualShippingCost); sale.sellingFee = safeNum(header.sellingFee);
    sale.taxRate = taxRate; sale.taxAmount = taxAmount; sale.taxableAmount = taxableAmount;
    sale.notes = header.notes||''; sale.status = newStatus; sale.updatedAt = nowISO();
    if(newStatus === 'Completed'){
      items.forEach(it=>{
        const product = s.products.find(p=>p.id===it.productId);
        const refundedQty = safeNum(refundedByProduct[it.productId]);
        const netHeld = Math.max(0, safeNum(it.quantity) - refundedQty);
        if(product) product.quantity = safeNum(product.quantity) - netHeld;
      });
      sale.effectsApplied = true;
    } else {
      sale.effectsApplied = false;
    }
  });
  return {ok:true};
}

/* ============================================================
   PARTIAL REFUNDS — authoritative refund ledger on the sale record
   ============================================================ */
function remainingRefundableQuantity(sale,item){
  return Math.max(0, safeNum(item.quantity) - refundedQuantityForItem(sale,item));
}
function remainingRefundableShipping(sale){
  return Math.max(0, round2(safeNum(sale.shippingCharged) - refundedShippingTotal(sale)));
}
function refundAllocationForQuantities(sale,qtyByProduct,includeShipping){
  const items=itemsForSale(sale.id);
  const rawTaxable=orderTaxableAmount(sale);
  const rawTax=rawOrderTax(sale);
  const remainingTaxable=Math.max(0,round2(rawTaxable-refundedRevenueTotal(sale)));
  const remainingTax=Math.max(0,round2(rawTax-refundedTaxTotal(sale)));
  let revenue=0,cogs=0;
  const refundItems=[];
  items.forEach(item=>{
    const qty=Math.min(remainingRefundableQuantity(sale,item),Math.max(0,safeNum(qtyByProduct[item.productId])));
    if(qty<=0)return;
    const lineQty=safeNum(item.quantity);
    const netPerUnit=lineQty>0 ? lineNet(item)/lineQty : 0;
    revenue=round2(revenue+qty*netPerUnit);
    cogs=round2(cogs+qty*safeNum(item.unitCost));
    refundItems.push({productId:item.productId,quantity:round2(qty)});
  });
  const tax=remainingTaxable>0&&revenue>0 ? round2(remainingTax*(revenue/remainingTaxable)) : 0;
  const shipping=includeShipping ? remainingRefundableShipping(sale) : 0;
  return {amount:round2(revenue+tax+shipping),revenueReduction:round2(revenue),salesTaxReversal:tax,shippingRefund:shipping,cogsReversal:round2(cogs),items:refundItems};
}
function refundRemainingAllocation(sale){
  const items=itemsForSale(sale.id);
  const qtyByProduct={};
  items.forEach(i=>qtyByProduct[i.productId]=remainingRefundableQuantity(sale,i));
  const allocation=refundAllocationForQuantities(sale,qtyByProduct,true);
  // Full refund closes the remaining financial balance, including any historical
  // price/tax basis preserved by earlier partial refunds. Quantity/C​OGS remains
  // based on the units still outstanding.
  allocation.revenueReduction=Math.max(0,round2(grossOrderRevenue(sale)-refundedRevenueTotal(sale)-refundedShippingTotal(sale)));
  allocation.salesTaxReversal=Math.max(0,round2(rawOrderTax(sale)-refundedTaxTotal(sale)));
  allocation.shippingRefund=remainingRefundableShipping(sale);
  allocation.cogsReversal=orderCOGS(sale);
  allocation.amount=round2(allocation.revenueReduction+allocation.salesTaxReversal+allocation.shippingRefund);
  return allocation;
}
function recordSaleRefund(id,opts){
  opts=opts||{};
  const sale=getRecord('sales',id);
  if(!sale)return {ok:false,errors:[t('val.orderNotFound')]};
  if(sale.status!=='Completed')return {ok:false,errors:[t('val.onlyCompletedCanRefund')]};
  const allocation=opts.full?refundRemainingAllocation(sale):refundAllocationForQuantities(sale,opts.qtyByProduct||{},!!opts.includeShipping);
  if(allocation.amount<=0)return {ok:false,errors:[t('sales.partialRefundNone')]};
  const now=todayISO();
  STORE.mutate(s=>{
    const rec=s.sales.find(x=>x.id===id);
    if(!rec)return;
    if(!Array.isArray(rec.refunds))rec.refunds=[];
    rec.refunds.push({
      id:uid('refund'),date:now,amount:allocation.amount,
      revenueReduction:allocation.revenueReduction,salesTaxReversal:allocation.salesTaxReversal,
      shippingRefund:allocation.shippingRefund,cogsReversal:allocation.cogsReversal,
      items:allocation.items,note:opts.note||''
    });
    rec.refundAmount=round2(sum(rec.refunds,r=>safeNum(r.amount)));
    rec.refundedAt=now;
    allocation.items.forEach(ri=>{
      const product=s.products.find(p=>p.id===ri.productId);
      if(product)product.quantity=safeNum(product.quantity)+safeNum(ri.quantity);
    });
    const remaining=refundRemainingAllocation(rec);
    if(remaining.amount<=0.009)rec.status='Refunded';
    rec.updatedAt=nowISO();
  });
  const updated=getRecord('sales',id);
  return {ok:true,full:updated&&updated.status==='Refunded',allocation};
}
function openPartialRefundForm(id){
  const sale=getRecord('sales',id);
  if(!sale||sale.status!=='Completed')return;

        <div class="summary-row"><span>${escapeHtml(t('sales.partialRefundTax'))}</span><strong id="refund-tax-preview">${fmtMoney(0)}</strong></div>

      </div></form>`,

        box.querySelector('#refund-cogs-preview').textContent=fmtMoney(a.cogsReversal);

      };
      box.querySelectorAll('.refund-qty').forEach(i=>i.addEventListener('input',refresh));

        box.querySelectorAll('.refund-qty').forEach(inp=>{

          if(item&&v>remainingRefundableQuantity(sale,item)+1e-9)invalid=true;q[inp.dataset.product]=v;
        });

        const res=recordSaleRefund(id,{qtyByProduct:q,includeShipping:box.querySelector('#refund-shipping').checked});
        if(!res.ok){box.querySelector('#partial-refund-errors').innerHTML=formErrorsBanner(res.errors);return;}
        closeModal();toast(res.full?t('sales.fullRefundToast'):t('sales.partialRefundToast'),'success');
      });
      refresh();
    }
  });
}

/* Controlled status transition for Cancel / Refund / re-open actions from the order list. */
function trySetSaleStatus(id, newStatus, opts){
  opts = opts || {};
  const sale = getRecord('sales', id);
  if(!sale) return {ok:false, errors:[t('val.orderNotFound')]};
  if(!SALE_STATUSES.includes(newStatus)) return {ok:false, errors:[t('val.unknownStatus')]};
  if(newStatus === 'Refunded' && sale.status !== 'Completed'){
    return {ok:false, errors:[t('val.onlyCompletedCanRefund')]};
  }
  if(newStatus === 'Refunded') return recordSaleRefund(id,{full:true});
  // A Completed order has already had cash collected. Cancelling it directly (instead
  // of refunding it) would restore inventory but leave no cash-flow record of the
  // money going back out — Refund is the only correct reversal path once an order is
  // Completed. This is enforced here (not just in the UI) so every caller follows the
  // same one authoritative transition model.
  if(newStatus === 'Cancelled' && sale.status === 'Completed'){
    return {ok:false, errors:[t('val.completedCannotCancel')]};
  }
  if(sale.status === 'Refunded'){
    return {ok:false, errors:[t('val.alreadyRefunded')]};
  }
  if(newStatus === 'Completed' && !sale.effectsApplied && !opts.forceOversell){
    const shortages = checkStockForItems(itemsForSale(id));
    if(shortages.length) return {ok:false, shortages};
  }
  STORE.mutate(s=>{
    const rec = s.sales.find(x=>x.id===id);
    if(!rec) return;
    const wasApplied = !!rec.effectsApplied;
    const refundAmountAtRefund = orderGrandTotal(rec);
    if(newStatus === 'Completed' && !wasApplied){
      itemsForSale(id).forEach(it=>{
        const product = s.products.find(p=>p.id===it.productId);
        if(product) product.quantity = safeNum(product.quantity) - safeNum(it.quantity);
      });
      rec.effectsApplied = true;
    } else if(newStatus !== 'Completed' && wasApplied){
      itemsForSale(id).forEach(it=>{
        const product = s.products.find(p=>p.id===it.productId);
        if(product) product.quantity = safeNum(product.quantity) + safeNum(it.quantity);
      });
      rec.effectsApplied = false;
    }
    if(newStatus === 'Refunded'){
      rec.refundedAt = todayISO();
      rec.refundAmount = refundAmountAtRefund; // snapshot of the customer cash returned, including sales tax
    }
    rec.status = newStatus;
    rec.updatedAt = nowISO();
  });
  return {ok:true};
}
function deleteSale(id){
  STORE.mutate(s=>{
    const sale = s.sales.find(x=>x.id===id);
    if(!sale) return;
    if(sale.effectsApplied){
      const refunded=refundedQuantityByProduct(sale);
      itemsForSale(id).forEach(it=>{
        const product=s.products.find(p=>p.id===it.productId);
        const netHeld=Math.max(0,safeNum(it.quantity)-safeNum(refunded[it.productId]));
        if(product)product.quantity=safeNum(product.quantity)+netHeld;
      });
    }
    s.saleItems = s.saleItems.filter(i=>i.saleId!==id);
    s.sales = s.sales.filter(x=>x.id!==id);
  });
}

function addCategory(name, type){
  if(isBlank(name)) return {ok:false, errors:[t('val.categoryNameRequired')]};
  const dup = STORE.state.categories.some(c=>c.type===type && !c.archived && c.name.trim().toLowerCase()===name.trim().toLowerCase());
  if(dup) return {ok:false, errors:[t('val.categoryAlreadyExists')]};
  const id = addRecord('categories', { name:name.trim(), type, archived:false });
  return {ok:true, id};
}
function archiveCategory(id){ updateRecord('categories', id, {archived:true}); }
function restoreCategory(id){ updateRecord('categories', id, {archived:false}); }

function addPaymentMethod(name){
  if(isBlank(name)) return {ok:false, errors:[t('val.paymentMethodNameRequired')]};
  const dup = STORE.state.paymentMethods.some(p=>!p.archived && p.name.trim().toLowerCase()===name.trim().toLowerCase());
  if(dup) return {ok:false, errors:[t('val.paymentMethodAlreadyExists')]};
  const id = addRecord('paymentMethods', { name:name.trim(), archived:false, isDefault:false });
  return {ok:true, id};
}
