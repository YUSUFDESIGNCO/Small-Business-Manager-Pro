/* ---------- Toast ---------- */
function toast(msg, type){
  const root = document.getElementById('toast-root');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.setAttribute('role','status');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3000);
}

/* ---------- Modal ---------- */
let MODAL_LAST_FOCUS = null;
function openModal(cfg){
  const root = document.getElementById('modal-root');
  const box = document.getElementById('modal-box');
  MODAL_LAST_FOCUS = document.activeElement;
  box.className = cfg.wide ? 'wide' : '';
  box.setAttribute('tabindex','-1');
  box.innerHTML = `
    <div class="modal-header"><h3>${escapeHtml(cfg.title||'')}</h3><button class="modal-close" data-close-modal="1" aria-label="${escapeHtml(t('common.close'))}">&times;</button></div>
    <div class="modal-body">${cfg.bodyHtml||''}</div>
    ${cfg.footerHtml ? `<div class="modal-footer">${cfg.footerHtml}</div>` : ''}
  `;
  root.classList.add('open');
  root.setAttribute('aria-hidden','false');
  if(cfg.onMount) cfg.onMount(box);
  // Move keyboard focus into the dialog so screen-reader/keyboard users aren't left
  // behind the modal on the page they can't see; prefer the first focusable field.
  const firstField = box.querySelector('input,select,textarea,button:not([data-close-modal])');
  (firstField || box).focus({preventScroll:true});
}
function closeModal(){
  const root = document.getElementById('modal-root');
  root.classList.remove('open');
  root.setAttribute('aria-hidden','true');
  document.getElementById('modal-box').innerHTML = '';
  if(MODAL_LAST_FOCUS && typeof MODAL_LAST_FOCUS.focus === 'function') MODAL_LAST_FOCUS.focus({preventScroll:true});
  MODAL_LAST_FOCUS = null;
}
document.addEventListener('click', (e)=>{ if(e.target.closest && e.target.closest('[data-close-modal]')) closeModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ closeModal(); return; }
  // Basic focus trap: while a modal is open, keep Tab cycling within it.
  if(e.key==='Tab'){
    const root = document.getElementById('modal-root');
    if(!root || !root.classList.contains('open')) return;
    const box = document.getElementById('modal-box');
    const focusables = Array.from(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
      .filter(elx => elx.offsetParent !== null);
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  openModal({
    title: opts.title || t('common.pleaseConfirm'),
    bodyHtml: `<p style="font-size:13px;line-height:1.6;">${escapeHtml(message)}</p>${opts.extraHtml||''}`,
    footerHtml: `<button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button>
                 <button class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirm-yes-btn">${escapeHtml(opts.confirmLabel||t('common.confirm'))}</button>`,
    onMount(box){
      box.querySelector('#confirm-yes-btn').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
    }
  });
}

/* ---------- File download / CSV ---------- */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function toCSV(rows, columns){
  const esc = v=>{ if(v===undefined||v===null) v=''; v=String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; };
  const header = columns.map(c=>esc(c.label)).join(',');
  const lines = rows.map(r=> columns.map(c=> esc(typeof c.value==='function'?c.value(r):r[c.value])).join(','));
  return [header, ...lines].join('\r\n');
}

/* ---------- Form field builders ---------- */
function fieldHtml(id, label, innerHtml, errorMsg, hint){
  return `<div class="field ${errorMsg?'error':''}">
    <label for="${id}">${escapeHtml(label)}</label>
    ${innerHtml}
    ${hint?`<div class="hint">${escapeHtml(hint)}</div>`:''}
    ${errorMsg?`<div class="field-error">${escapeHtml(errorMsg)}</div>`:''}
  </div>`;
}
function textField(o){
  const type = o.type||'text';
  const step = type==='number' ? (o.step||'0.01') : null;
  return fieldHtml(o.id, o.label,
    `<input type="${type}" id="${o.id}" name="${o.id}" value="${escapeHtml(o.value!==undefined?o.value:'')}"
      placeholder="${escapeHtml(o.placeholder||'')}" ${step?`step="${step}"`:''} ${o.min!==undefined?`min="${o.min}"`:''}
      ${o.required?'required':''} ${o.readonly?'readonly':''}>`, o.error, o.hint);
}
function selectField(o){
  const opts = (o.options||[]).map(opt=>{
    const val = Array.isArray(opt)?opt[0]:opt.value;
    const lab = Array.isArray(opt)?opt[1]:opt.label;
    return `<option value="${escapeHtml(val)}" ${String(val)===String(o.value)?'selected':''}>${escapeHtml(lab)}</option>`;
  }).join('');
  return fieldHtml(o.id, o.label,
    `<select id="${o.id}" name="${o.id}" ${o.required?'required':''}>
      ${o.placeholder?`<option value="">${escapeHtml(o.placeholder)}</option>`:''}${opts}
    </select>`, o.error, o.hint);
}
function textareaField(o){
  return fieldHtml(o.id, o.label,
    `<textarea id="${o.id}" name="${o.id}" placeholder="${escapeHtml(o.placeholder||'')}">${escapeHtml(o.value||'')}</textarea>`, o.error, o.hint);
}
function formErrorsBanner(errors){
  if(!errors || !errors.length) return '';
  return `<div class="form-errors"><strong>${escapeHtml(t('common.pleaseFixFollowing'))}</strong><ul>${errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
}
function formData(form){
  const out = {};
  new FormData(form).forEach((v,k)=>{ out[k]=v; });
  return out;
}

/* ---- Draft line items held in memory while the New/Edit Sale modal is open ---- */
let SALE_DRAFT_ITEMS = [];
function renderSaleItemsEditor(){
  if(!STORE.state.products.length) return `<p class="muted" style="font-size:12.5px;">${escapeHtml(t('sales.addProductBeforeSale'))}</p>`;
  const rows = SALE_DRAFT_ITEMS.map((it,idx)=>{
    const opts = STORE.state.products.map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${escapeHtml(p.name)} (${escapeHtml(p.sku)})</option>`).join('');
    return `<tr data-row="${idx}">
      <td><select class="li-product" data-idx="${idx}" aria-label="${escapeHtml(t('common.product'))} ${idx+1}"><option value="">${escapeHtml(t('common.selectEllipsis'))}</option>${opts}</select></td>
      <td><input type="number" class="li-qty" data-idx="${idx}" value="${it.quantity}" min="1" step="1" style="width:70px;"></td>
      <td><input type="number" class="li-price" data-idx="${idx}" value="${it.unitPrice}" step="0.01" style="width:90px;"></td>
      <td><input type="number" class="li-discount" data-idx="${idx}" value="${it.discount}" step="0.01" style="width:80px;"></td>
      <td class="num li-total">${fmtMoney((it.quantity*it.unitPrice)-it.discount)}</td>
      <td><button type="button" class="btn btn-ghost btn-sm li-remove" data-idx="${idx}">&times;</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="table-wrap"><table class="data" style="min-width:520px;">
      <thead><tr><th>${escapeHtml(t('common.product'))}</th><th>${escapeHtml(t('common.qty'))}</th><th>${escapeHtml(t('common.unitPrice'))}</th><th>${escapeHtml(t('common.discount')||'Discount')}</th><th class="num">${escapeHtml(t('sales.thLineTotal'))}</th><th></th></tr></thead>
      <tbody id="sale-items-body">${rows || `<tr><td colspan="6" class="muted" style="text-align:center;padding:16px;">${escapeHtml(t('sales.noLinesYet'))}</td></tr>`}</tbody>
    </table></div>
    <button type="button" class="btn btn-outline btn-sm" id="li-add" style="margin-top:8px;">${escapeHtml(t('sales.addLine'))}</button>
  `;
}
function wireSaleItemsEditor(box, refreshTotals){
  const editorHost = box.querySelector('#sale-items-editor');
  function rerenderEditor(){ editorHost.innerHTML = renderSaleItemsEditor(); wireRows(); refreshTotals(); }
  function wireRows(){
    editorHost.querySelectorAll('.li-product').forEach(sel=>sel.addEventListener('change', e=>{
      const idx = +e.target.getAttribute('data-idx'); const product = getRecord('products', e.target.value);
      SALE_DRAFT_ITEMS[idx].productId = e.target.value;
      if(product) SALE_DRAFT_ITEMS[idx].unitPrice = product.price;
      rerenderEditor();
    }));
    editorHost.querySelectorAll('.li-qty').forEach(inp=>inp.addEventListener('input', e=>{
      SALE_DRAFT_ITEMS[+e.target.getAttribute('data-idx')].quantity = safeNum(e.target.value,1); updateRowTotal(e.target); refreshTotals();
    }));
    editorHost.querySelectorAll('.li-price').forEach(inp=>inp.addEventListener('input', e=>{
      SALE_DRAFT_ITEMS[+e.target.getAttribute('data-idx')].unitPrice = safeNum(e.target.value,0); updateRowTotal(e.target); refreshTotals();
    }));
    editorHost.querySelectorAll('.li-discount').forEach(inp=>inp.addEventListener('input', e=>{
      SALE_DRAFT_ITEMS[+e.target.getAttribute('data-idx')].discount = safeNum(e.target.value,0); updateRowTotal(e.target); refreshTotals();
    }));
    editorHost.querySelectorAll('.li-remove').forEach(b=>b.addEventListener('click', e=>{
      SALE_DRAFT_ITEMS.splice(+e.target.getAttribute('data-idx'),1); rerenderEditor();
    }));
    const addBtn = editorHost.querySelector('#li-add');
    if(addBtn) addBtn.addEventListener('click', ()=>{ SALE_DRAFT_ITEMS.push({productId:'',quantity:1,unitPrice:0,discount:0}); rerenderEditor(); });
  }
  function updateRowTotal(inputEl){
    const idx = +inputEl.getAttribute('data-idx');
    const it = SALE_DRAFT_ITEMS[idx];
    const row = editorHost.querySelector(`tr[data-row="${idx}"] .li-total`);
    if(row) row.textContent = fmtMoney((it.quantity*it.unitPrice)-it.discount);
  }
  wireRows();
}
function collectDraftItems(){ return SALE_DRAFT_ITEMS.filter(it=>it.productId).map(it=>({productId:it.productId, quantity:it.quantity, unitPrice:it.unitPrice, discount:it.discount})); }

        <label>${escapeHtml(t('sales.orderLines'))}</label>
        <div id="sale-items-editor">${renderSaleItemsEditor()}</div>
        <div class="sale-tax-section">

          <div class="sale-tax-grid">
            ${textField({id:'taxRate', label:t('sales.fieldSalesTaxRate'), type:'number', value: editing?(editing.taxRate||0):'0.00', min:'0', step:'0.01'})}
            ${textField({id:'taxAmount', label:t('sales.fieldSalesTaxAmount'), type:'number', value: editing?(editing.taxAmount||0):'0.00', readonly:true})}
          </div>
          <p class="sale-tax-note">${escapeHtml(t('sales.salesTaxHint'))}</p>
        </div>
        <div class="form-grid cols-3" style="margin-top:14px;">
          ${textField({id:'shippingCharged', label:t('sales.fieldShippingCharged'), type:'number', value: editing?(editing.shippingCharged||0):'0.00'})}
          ${textField({id:'actualShippingCost', label:t('sales.fieldActualShippingCost'), type:'number', value: editing?(editing.actualShippingCost||0):'0.00', hint:'Actual amount paid by the business for shipping this order.'})}
          ${textField({id:'sellingFee', label:t('sales.fieldSellingFeeThisOrder'), type:'number', value: editing?editing.sellingFee:'0.00', hint:t('sales.fieldSellingFeeHint')})}
          ${selectField({id:'status', label:t('sales.fieldOrderStatus'), value: editing?editing.status:'Completed', options: SALE_STATUSES.map(s=>[s,statusLabel(s)])})}
        </div>
        ${textareaField({id:'notes', label:t('common.notes'), value: editing?editing.notes:''})}
        <div class="sale-tax-summary" aria-live="polite">
          <div class="summary-row"><span>${escapeHtml(t('sales.subtotal'))}</span><strong id="sale-subtotal-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row"><span>${escapeHtml(t('sales.discount'))}</span><strong id="sale-discount-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row"><span>${escapeHtml(t('sales.taxableAmount'))}</span><strong id="sale-taxable-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row tax-row"><span>${escapeHtml(t('sales.salesTax'))}</span><strong id="sale-tax-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row"><span>${escapeHtml(t('sales.shipping'))}</span><strong id="sale-shipping-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row"><span>${escapeHtml(t('sales.fieldActualShippingCost'))}</span><strong id="sale-actual-shipping-preview">${fmtMoney(0)}</strong></div>
          <div class="summary-row total"><span><strong>${escapeHtml(t('sales.grandTotal'))}</strong></span><strong id="sale-total-preview">${fmtMoney(0)}</strong></div>
        </div>
      </form>`,
    footerHtml: `<button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" id="sale-save-btn">${editing?escapeHtml(t('common.saveChanges')):escapeHtml(t('sales.saveOrder'))}</button>`,
    onMount(box){
      function refreshTotals(){
        const subtotal = round2(SALE_DRAFT_ITEMS.reduce((a,it)=>a+(safeNum(it.quantity)*safeNum(it.unitPrice)),0));
        const discount = round2(SALE_DRAFT_ITEMS.reduce((a,it)=>a+safeNum(it.discount),0));
        const taxable = round2(subtotal - discount);
        const taxRate = Math.max(0, Math.min(100, safeNum(box.querySelector('[name=taxRate]').value)));
        const tax = round2(taxable * taxRate / 100);
        const shipping = safeNum(box.querySelector('[name=shippingCharged]').value);
        const actualShipping = safeNum(box.querySelector('[name=actualShippingCost]').value);
        const grandTotal = round2(taxable + tax + shipping);
        box.querySelector('[name=taxAmount]').value = tax.toFixed(2);
        box.querySelector('#sale-subtotal-preview').textContent = fmtMoney(subtotal);
        box.querySelector('#sale-discount-preview').textContent = fmtMoney(discount);
        box.querySelector('#sale-taxable-preview').textContent = fmtMoney(taxable);
        box.querySelector('#sale-tax-preview').textContent = fmtMoney(tax);
        box.querySelector('#sale-shipping-preview').textContent = fmtMoney(shipping);
        box.querySelector('#sale-actual-shipping-preview').textContent = fmtMoney(actualShipping);
        box.querySelector('#sale-total-preview').textContent = fmtMoney(grandTotal);
      }
      wireSaleItemsEditor(box, refreshTotals);
      box.querySelector('[name=shippingCharged]').addEventListener('input', refreshTotals);
      box.querySelector('[name=actualShippingCost]').addEventListener('input', refreshTotals);
      box.querySelector('[name=taxRate]').addEventListener('input', refreshTotals);
      refreshTotals();
      function doSave(force){
        const header = formData(box.querySelector('#sale-form'));
        const items = collectDraftItems();
        const res = editing ? updateSaleRecord(editing.id, header, items, {forceOversell:force}) : createSale(header, items, {forceOversell:force});
        if(!res.ok){
          if(res.shortages){
            const list = res.shortages.map(s=>t('sales.stockShortageLine',{name:escapeHtml(s.name), requested:s.requested, available:s.available})).join('<br>');
            confirmAction(`${escapeHtml(t('sales.stockShortageIntro'))}<br><br>${list}<br><br>${escapeHtml(t('sales.stockShortageQuestion'))}`, ()=>doSave(true),
              {title:t('sales.notEnoughStockTitle'), confirmLabel:t('sales.sellAnyway'), extraHtml:''});
            return;
          }
          box.querySelector('#sale-form-errors').innerHTML = formErrorsBanner(res.errors);
          return;
        }
        closeModal();
        toast(editing?t('sales.toastOrderUpdated'):t('sales.toastOrderSaved'), 'success');
      }
      box.querySelector('#sale-save-btn').addEventListener('click', ()=>doSave(false));
    }
  });
}
function openSaleDetail(id){
  const sale = getRecord('sales', id);
  if(!sale) return;
  const items = itemsForSale(id);
  const cust = getRecord('customers', sale.customerId);
  const pm = getRecord('paymentMethods', sale.paymentMethodId);
  const rev = orderRevenue(sale), cogs = orderCOGS(sale);
  const canComplete = sale.status !== 'Completed' && sale.status !== 'Refunded';
  const hasRefunds = refundRecords(sale).length > 0;
  // Cancel is only for orders that haven't had cash collected yet (New/Processing/
  // Shipped). A Completed order has already had cash collected, so it must go
  // through Refund instead — that's the only path that also records the cash
  // outflow (see trySetSaleStatus). A Refunded order is a closed, terminal record.
  const canCancel = sale.status === 'New' || sale.status === 'Processing' || sale.status === 'Shipped';
  const canRefund = sale.status === 'Completed';
  const canEdit = sale.status !== 'Refunded' && sale.status !== 'Cancelled';
  openModal({
    title: t('sales.orderDetailTitle',{orderNo:sale.orderNo}),
    wide:true,
    bodyHtml: `
      <div class="row between" style="margin-bottom:14px;">
        <div>${statusBadge(sale.status)} <span class="muted" style="margin-left:8px;">${fmtDate(sale.date)}</span></div>
        <div class="muted">${cust?escapeHtml(cust.name):escapeHtml(t('common.walkIn'))} &middot; ${pm?escapeHtml(pm.name):escapeHtml(t('sales.noPaymentMethod'))}</div>
      </div>
      <div class="grid-3" style="margin-bottom:10px;">
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('common.paymentMethod'))}</div><strong>${pm?escapeHtml(pm.name):escapeHtml(t('sales.noPaymentMethod'))}</strong></div>
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('sales.fieldPaymentStatus'))}</div><strong>${paymentStatusBadge(sale.paymentStatus || 'Paid')}</strong></div>
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('sales.fieldSalesChannel'))}</div><strong>${escapeHtml(sale.salesChannel || 'Other')}</strong></div>
      </div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>${escapeHtml(t('common.product'))}</th><th>${escapeHtml(t('common.sku'))}</th><th class="num">${escapeHtml(t('common.qty'))}</th><th class="num">${escapeHtml(t('common.unitPrice'))}</th><th class="num">${escapeHtml(t('common.discount'))}</th><th class="num">${escapeHtml(t('sales.thLineTotal'))}</th></tr></thead>
        <tbody>${items.map(i=>`<tr><td>${escapeHtml(i.productName)}</td><td class="mono">${escapeHtml(i.sku)}</td><td class="num">${fmtNum(i.quantity)}</td><td class="num">${fmtMoney(i.unitPrice)}</td><td class="num">${fmtMoney(i.discount)}</td><td class="num">${fmtMoney(lineNet(i))}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="sale-tax-summary" style="margin-top:14px;">
        <div class="summary-row"><span>${escapeHtml(t('sales.subtotal'))}</span><strong>${fmtMoney(orderSubtotal(sale))}</strong></div>
        <div class="summary-row"><span>${escapeHtml(t('sales.discount'))}</span><strong>${fmtMoney(orderDiscount(sale))}</strong></div>
        <div class="summary-row"><span>${escapeHtml(t('sales.taxableAmount'))}</span><strong>${fmtMoney(orderTaxableAmount(sale))}</strong></div>
        <div class="summary-row tax-row"><span>${escapeHtml(t('sales.salesTax'))} (${fmtPct(safeNum(sale.taxRate),2)})</span><strong>${fmtMoney(orderSalesTax(sale))}</strong></div>
        <div class="summary-row"><span>${escapeHtml(t('sales.shipping'))}</span><strong>${fmtMoney(sale.shippingCharged)}</strong></div>
        <div class="summary-row total"><span><strong>${escapeHtml(t('sales.grandTotal'))}</strong></span><strong>${fmtMoney(orderGrandTotal(sale))}</strong></div>
      </div>
      <div class="grid-2" style="margin-top:10px;">
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('common.revenue'))}</div><strong>${fmtMoney(rev)}</strong></div>
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('sales.sellingFee'))}</div><strong>${fmtMoney(sale.sellingFee)}</strong></div>
      </div>
      ${(sale.status==='Refunded'||sale.status==='Cancelled')?`<p class="hint" style="margin-top:6px;">${escapeHtml(t('sales.notCountedNote',{status:statusLabel(sale.status).toLowerCase()}))}</p>`:''}
      <div class="grid-2" style="margin-top:10px;">
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('common.cogs'))}</div><strong>${fmtMoney(cogs)}</strong></div>
        <div class="card tight"><div class="label muted" style="font-size:11px;">${escapeHtml(t('sales.grossProfit'))}</div><strong>${fmtMoney(rev-cogs)}</strong></div>
      </div>
      ${sale.notes?`<p class="hint" style="margin-top:10px;">${escapeHtml(sale.notes)}</p>`:''}
      ${hasRefunds?`<div class="card tight" style="margin-top:12px;">
        <div class="section-title" style="font-size:13px;">${escapeHtml(t('sales.refundHistory'))}</div>
        <div class="table-wrap"><table class="data"><thead><tr><th>${escapeHtml(t('sales.refundDate'))}</th><th class="num">${escapeHtml(t('sales.refundAmountLabel'))}</th><th class="num">${escapeHtml(t('sales.partialRefundRevenue'))}</th><th class="num">${escapeHtml(t('sales.partialRefundTax'))}</th><th class="num">${escapeHtml(t('sales.partialRefundCOGS'))}</th></tr></thead>
        <tbody>${refundRecords(sale).map(r=>`<tr><td>${fmtDate(r.date)}</td><td class="num">${fmtMoney(r.amount)}</td><td class="num">${fmtMoney(r.revenueReduction)}</td><td class="num">${fmtMoney(r.salesTaxReversal)}</td><td class="num">${fmtMoney(r.cogsReversal)}</td></tr>`).join('')}</tbody></table></div>
        <p class="hint" style="margin-top:8px;">${escapeHtml(t('sales.refundedNote',{date:fmtDate(sale.refundedAt), amount:fmtMoney(sale.refundAmount)}))}</p>
      </div>`:''}
    `,
    footerHtml: `
      <button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.close'))}</button>
      ${canEdit?`<button class="btn btn-ghost" id="sale-edit-btn">${escapeHtml(t('common.edit'))}</button>`:''}
      ${canCancel?`<button class="btn btn-outline" id="sale-cancel-btn">${escapeHtml(t('sales.cancelOrder'))}</button>`:''}
      ${canRefund?`<button class="btn btn-danger" id="sale-refund-btn">${escapeHtml(t('sales.refund'))}</button>`:''}
      ${canComplete?`<button class="btn btn-accent" id="sale-complete-btn">${escapeHtml(t('sales.markCompleted'))}</button>`:''}
      <button class="btn btn-danger" id="sale-delete-btn">${escapeHtml(t('common.delete'))}</button>
    `,
    onMount(box){
      const editBtn = box.querySelector('#sale-edit-btn');
      if(editBtn) editBtn.addEventListener('click', ()=>{ closeModal(); openSaleForm(sale.id); });
      const del = box.querySelector('#sale-delete-btn');
      if(del) del.addEventListener('click', ()=> confirmAction(t('sales.confirmDeleteOrder'), ()=>{ deleteSale(sale.id); toast(t('sales.toastOrderDeleted'),'success'); }, {title:t('sales.confirmDeleteTitle'), confirmLabel:t('common.delete')}));
      const comp = box.querySelector('#sale-complete-btn');
      if(comp) comp.addEventListener('click', ()=>{
        const res = trySetSaleStatus(sale.id, 'Completed');
        if(!res.ok && res.shortages){
          const list = res.shortages.map(s=>t('sales.stockShortageLine',{name:escapeHtml(s.name), requested:s.requested, available:s.available})).join('<br>');
          confirmAction(`${escapeHtml(t('sales.notEnoughStockPlain'))}<br><br>${list}<br><br>${escapeHtml(t('sales.completeAnywayQuestion'))}`, ()=>{ trySetSaleStatus(sale.id,'Completed',{forceOversell:true}); toast(t('sales.toastMarkedCompleted'),'success'); }, {title:t('sales.notEnoughStockTitle'), confirmLabel:t('sales.completeAnyway')});
          return;
        }
        toast(t('sales.toastMarkedCompletedFull'),'success');
      });
      const cancel = box.querySelector('#sale-cancel-btn');
      if(cancel) cancel.addEventListener('click', ()=> confirmAction(t('sales.confirmCancelOrder'), ()=>{ trySetSaleStatus(sale.id,'Cancelled'); toast(t('sales.toastCancelled'),'success'); }, {title:t('sales.cancelOrder'), confirmLabel:t('sales.cancelOrder')}));
      const refund = box.querySelector('#sale-refund-btn');
      if(refund) refund.addEventListener('click', ()=> openPartialRefundForm(sale.id));
    }
  });
}

function salesChannelReport(range){
  const groups = {};
  completedSales(range).forEach(sale=>{
    const channel = SALES_CHANNELS.includes(sale.salesChannel) ? sale.salesChannel : 'Other';
    if(!groups[channel]) groups[channel] = {channel, orders:0, units:0, revenue:0, cogs:0, grossProfit:0, actualShipping:0, sellingFees:0};
    const g = groups[channel];
    g.orders += 1;
    g.units += orderUnits(sale);
    g.revenue = round2(g.revenue + orderRevenue(sale));
    g.cogs = round2(g.cogs + orderCOGS(sale));
    g.grossProfit = round2(g.grossProfit + (orderRevenue(sale) - orderCOGS(sale)));
    g.actualShipping = round2(g.actualShipping + safeNum(sale.actualShippingCost));
    g.sellingFees = round2(g.sellingFees + safeNum(sale.sellingFee));
  });
  return SALES_CHANNELS.filter(c=>groups[c]).map(c=>{
    const g = groups[c];
    g.contribution = round2(g.grossProfit - g.actualShipping - g.sellingFees);
    return g;
  });
}

/* ================= BUSINESS GOALS ================= */
function GOAL_TYPE_LABELS_MAP(){
  return { revenue:t('goals.typeRevenue'), profit:t('goals.typeProfit'), orders:t('goals.typeOrders'), margin:t('goals.typeMargin'), custom:t('goals.typeCustom') };
}
const GOAL_TYPE_LABELS = GOAL_TYPE_LABELS_MAP();
function goalMetricDisplay(goal, value){
  if(goal.type==='orders') return fmtNum(value);
  if(goal.type==='margin') return fmtPct(value);
  return fmtMoney(value);
}
function mountGoalsPage(el){
  const goals = STORE.state.goals.slice().sort((a,b)=> (a.deadline||'').localeCompare(b.deadline||''));
  const goalTypeLabels = GOAL_TYPE_LABELS_MAP();
  el.innerHTML = `
    <div class="card">
      <div class="table-toolbar">
        <div class="section-title" style="margin-bottom:0;">${escapeHtml(t('goals.pageTitle'))}</div>
        <div class="spacer"></div>
        <button class="btn btn-accent" id="goal-add">${escapeHtml(t('goals.addBtn'))}</button>
      </div>
      ${goals.length ? `<div class="grid-2" style="margin-top:6px;">
        ${goals.map(g=>{
          const p = goalProgress(g);
          const barClass = p.status==='Needs Attention' ? 'amber' : (p.status==='Completed' ? 'green' : '');
          return `<div class="card" style="box-shadow:none;border:1px solid var(--border);">
            <div class="row between" style="margin-bottom:4px;">
              <strong>${escapeHtml(g.name)}</strong>
              ${statusBadge(p.status)}
            </div>
            <div class="hint" style="margin-bottom:10px;">${escapeHtml(goalTypeLabels[g.type]||t('goals.typeGeneric'))} &middot; ${escapeHtml(t('goals.byDeadline',{date:fmtDate(g.deadline)}))}</div>
            <div class="progress-track"><div class="progress-fill ${barClass}" style="width:${clamp(p.pct,0,100)}%;"></div></div>
            <div class="row between" style="margin-top:8px;font-size:12.5px;">
              <span class="muted">${escapeHtml(t('goals.ofTarget',{current:goalMetricDisplay(g,p.current), target:goalMetricDisplay(g,p.target)}))}</span>
              <span><strong>${fmtPct(p.pct,0)}</strong></span>
            </div>
            ${g.notes ? `<p class="hint" style="margin-top:8px;">${escapeHtml(g.notes)}</p>` : ''}
            <div class="row-actions" style="margin-top:12px;">
              <button class="btn btn-ghost btn-sm" data-edit="${g.id}">${escapeHtml(t('common.edit'))}</button>
              <button class="btn btn-ghost btn-sm" data-remove="${g.id}">${escapeHtml(t('common.delete'))}</button>
            </div>
          </div>`;
        }).join('')}
      </div>` : emptyState('&#127919;',t('goals.emptyTitle'),t('goals.emptyText'), `<button class="btn btn-accent" id="goal-add-empty">${escapeHtml(t('goals.addBtn'))}</button>`)}
    </div>`;
  const addBtn = el.querySelector('#goal-add') || el.querySelector('#goal-add-empty');
  if(addBtn) addBtn.addEventListener('click', ()=>openGoalForm());
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openGoalForm(b.getAttribute('data-edit'))));
  el.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>{
    confirmAction(t('goals.confirmDelete'), ()=>{ deleteGoal(b.getAttribute('data-remove')); toast(t('goals.toastDeleted'),'success'); }, {title:t('goals.confirmDeleteTitle'), confirmLabel:t('common.delete')});
  }));
}
function openGoalForm(id){
  const editing = id ? getRecord('goals', id) : null;
  const type = editing ? editing.type : 'revenue';
  openModal({
    title: editing?t('goals.editTitle'):t('goals.addTitle'),
    bodyHtml: `
      <form id="goal-form">
        <div id="goal-form-errors"></div>
        ${textField({id:'name', label:t('goals.fieldName'), value: editing?editing.name:'', placeholder:t('goals.fieldNamePlaceholder')})}
        <div class="form-grid">
          ${selectField({id:'type', label:t('goals.fieldType'), value:type, options: Object.entries(GOAL_TYPE_LABELS_MAP())})}
          ${textField({id:'targetValue', label:t('goals.fieldTargetValue'), type:'number', value: editing?editing.targetValue:'', hint:t('goals.fieldTargetHint')})}
        </div>
        <div class="form-grid">
          ${textField({id:'startDate', label:t('goals.fieldStartDate'), type:'date', value: editing?editing.startDate:todayISO()})}
          ${textField({id:'deadline', label:t('goals.fieldDeadline'), type:'date', value: editing?editing.deadline:''})}
        </div>
        <div id="goal-custom-field" style="display:${type==='custom'?'block':'none'};">
          ${textField({id:'currentValueOverride', label:t('goals.fieldCurrentValueManual'), type:'number', value: editing?editing.currentValueOverride:'0', hint:t('goals.fieldCurrentValueHint')})}
        </div>
        ${textareaField({id:'notes', label:t('common.notes'), value: editing?editing.notes:''})}
      </form>`,
    footerHtml: `<button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" id="goal-save-btn">${editing?escapeHtml(t('common.saveChanges')):escapeHtml(t('goals.addBtn'))}</button>`,
    onMount(box){
      const typeSel = box.querySelector('#type');
      typeSel.addEventListener('change', ()=>{ box.querySelector('#goal-custom-field').style.display = typeSel.value==='custom' ? 'block' : 'none'; });
      box.querySelector('#goal-save-btn').addEventListener('click', ()=>{
        const data = formData(box.querySelector('#goal-form'));
        const res = editing ? updateGoalRecord(editing.id, data) : createGoal(data);
        if(!res.ok){ box.querySelector('#goal-form-errors').innerHTML = formErrorsBanner(res.errors); return; }
        closeModal(); toast(editing?t('goals.toastUpdated'):t('goals.toastAdded'), 'success');
      });
    }
  });
}

/* ================= SETTINGS ================= */
function updateSettings(patch){ STORE.mutate(s=> Object.assign(s.settings, patch)); }

function profileHasData(){
  const s = STORE.state.settings;
  return !!(s && String(s.businessName || '').trim());
}
function profileCurrencyOptions(){
  return [['$',t('settings.currencyDollar')],['€',t('settings.currencyEuro')],['£',t('settings.currencyPound')],['₦',t('settings.currencyNaira')],['₹',t('settings.currencyRupee')],['A$',t('settings.currencyAud')],['C$',t('settings.currencyCad')]];
}
function profileMonthOptions(){
  return [['1',t('settings.monthJanuary')],['2',t('settings.monthFebruary')],['3',t('settings.monthMarch')],['4',t('settings.monthApril')],['5',t('settings.monthMay')],['6',t('settings.monthJune')],['7',t('settings.monthJuly')],['8',t('settings.monthAugust')],['9',t('settings.monthSeptember')],['10',t('settings.monthOctober')],['11',t('settings.monthNovember')],['12',t('settings.monthDecember')]];
}
function openProfileManager(){
  const render = mode=>{
    const s = STORE.state.settings;
    const has = profileHasData();
    if(mode==='view'){
      openModal({
        title:t('profile.title'),
        bodyHtml:`<div class="card" style="margin:0;border:1px solid var(--border);box-shadow:none;">
          <div class="section-title">${escapeHtml(has?t('profile.viewTitle'):t('profile.noProfile'))}</div>
          ${has ? `<div class="form-grid">
            <div><div class="hint">${escapeHtml(t('profile.fieldBusinessName'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.businessName||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldCurrencySymbol'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.currencySymbol||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldDateFormat'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.dateFormat||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldLowStockThreshold'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(String(s.lowStockDefaultThreshold??t('profile.emptyValue')))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldFiscalYearStart'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml((profileMonthOptions().find(x=>x[0]===String(s.fiscalYearStartMonth||1))||['',t('profile.emptyValue')])[1])}</div></div>
          </div>` : `<p class="hint" style="margin:0;">${escapeHtml(t('profile.noProfile'))}</p>`}
          ${has ? `<p class="hint" style="margin:16px 0 0;">${escapeHtml(t('profile.removeHint'))}</p>` : ''}
        </div>`,
        footerHtml:has ? `<button class="btn btn-outline" id="profile-edit-btn">${escapeHtml(t('profile.edit'))}</button><button class="btn btn-danger" id="profile-remove-btn">${escapeHtml(t('profile.remove'))}</button>` : `<button class="btn btn-accent" id="profile-add-btn">${escapeHtml(t('profile.add'))}</button>`,
        onMount(box){
          if(has){
            box.querySelector('#profile-edit-btn').addEventListener('click',()=>render('edit'));
            box.querySelector('#profile-remove-btn').addEventListener('click',()=>confirmAction(t('profile.deleteConfirm'),()=>{
              STORE.mutate(st=>{ st.settings.businessName=''; st.settings.logoDataUrl=''; st.settings.currencySymbol='$'; st.settings.currencyCode='USD'; st.settings.dateFormat='MM/DD/YYYY'; st.settings.fiscalYearStartMonth=1; st.settings.lowStockDefaultThreshold=5; });
              toast(t('profile.removed'),'success');
            },{title:t('profile.remove'),confirmLabel:t('profile.remove')}));
          } else {
            box.querySelector('#profile-add-btn').addEventListener('click',()=>render('create'));
          }
        }
      });
      return;
    }
    const isCreate=mode==='create';
    openModal({
      title:t(isCreate?'profile.createTitle':'profile.editTitle'),
      bodyHtml:`<form id="business-profile-form">
        <div class="form-grid">
          ${textField({id:'profile-businessName',label:t('profile.fieldBusinessName'),value:isCreate?'':s.businessName||''})}
          ${selectField({id:'profile-currencySymbol',label:t('profile.fieldCurrencySymbol'),value:s.currencySymbol||'$',options:profileCurrencyOptions()})}
        </div>
        <div class="form-grid">
          ${selectField({id:'profile-dateFormat',label:t('profile.fieldDateFormat'),value:s.dateFormat||'MM/DD/YYYY',options:[['MM/DD/YYYY','MM/DD/YYYY'],['DD/MM/YYYY','DD/MM/YYYY'],['YYYY-MM-DD','YYYY-MM-DD']]})}
          ${textField({id:'profile-lowStockDefaultThreshold',label:t('profile.fieldLowStockThreshold'),type:'number',step:'1',value:s.lowStockDefaultThreshold??5})}
        </div>
        ${selectField({id:'profile-fiscalYearStartMonth',label:t('profile.fieldFiscalYearStart'),value:String(s.fiscalYearStartMonth||1),options:profileMonthOptions()})}
        <div id="business-profile-errors" style="margin-top:12px;"></div>
      </form>`,
      footerHtml:`<button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" id="profile-save-btn">${escapeHtml(isCreate?t('profile.create'):t('common.saveChanges'))}</button>`,
      onMount(box){
        box.querySelector('#profile-save-btn').addEventListener('click',()=>{
          const data=formData(box.querySelector('#business-profile-form'));
          const businessName=String(data['profile-businessName']||'').trim();
          if(!businessName){box.querySelector('#business-profile-errors').innerHTML=formErrorsBanner([t('profile.requiredBusinessName')]);return;}
          STORE.mutate(st=>{
            st.settings.businessName=businessName;
            st.settings.currencySymbol=data['profile-currencySymbol']||'$';
            st.settings.dateFormat=data['profile-dateFormat']||'MM/DD/YYYY';
            st.settings.lowStockDefaultThreshold=Math.max(0,Math.floor(safeNum(data['profile-lowStockDefaultThreshold'],5)));
            st.settings.fiscalYearStartMonth=Math.min(12,Math.max(1,Math.floor(safeNum(data['profile-fiscalYearStartMonth'],1))));
          });
          closeModal();
          toast(t(isCreate?'profile.created':'profile.saved'),'success');
        });
      }
    });
  };
  render('view');
}

const PAGE_MOUNTERS = {
  dashboard: mountDashboardPage,
  sales: mountSalesPage,
  customers: mountCustomersPage,
  products: mountProductsPage,
  inventory: mountInventoryPage,
  purchases: mountPurchasesPage,

/* ---------- Master render entry point (called by STORE.render()) ---------- */
function renderApp(){
  const appEl = document.getElementById('app');
  const gateEl = document.getElementById('welcome-gate');
  if(!appEl || !gateEl) return; // DOM not ready yet

  if(!STORE.state.meta.onboarded){
    appEl.style.display = 'none';
    gateEl.style.display = 'block';
    if(typeof renderWelcomeGate === 'function') renderWelcomeGate(gateEl);
    return;
  }
  appEl.style.display = '';
  gateEl.style.display = 'none';

  const route = currentRoute();
  const titleEl = document.getElementById('page-title');
  if(titleEl) titleEl.textContent = t(ROUTE_TITLE_KEYS[route] || 'nav.dashboard');
  renderSidebar();
  const content = document.getElementById('content');
  if(!content) return;
  const mounter = PAGE_MOUNTERS[route] || mountDashboardPage;
  mounter(content);
}

/* ---------- One-time wiring for static shell chrome (call once at startup) ---------- */
let SHELL_CHROME_WIRED = false;
function initShellChrome(){
  if(SHELL_CHROME_WIRED) return;
  SHELL_CHROME_WIRED = true;
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) toggle.addEventListener('click', openSidebar);
  const backdrop = document.getElementById('sidebar-backdrop');
  if(backdrop) backdrop.addEventListener('click', closeSidebar);
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.addEventListener('click', ()=>{ openProfileManager(); });
  document.documentElement.lang = CURRENT_LANG;
  const langSelect = document.getElementById('lang-select');
  if(langSelect){
    langSelect.value = CURRENT_LANG;
    langSelect.addEventListener('change', (e)=>{ setLanguage(e.target.value); });
  }
  refreshStaticChromeText();
}
/* Translates the small handful of static shell strings that live outside the
   areas renderApp() regenerates (topbar profile button, sidebar toggle,
   sidebar footer, sidebar tagline is a proper noun and is left untranslated). */
function refreshStaticChromeText(){
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.textContent = t('shell.profile');
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) toggle.setAttribute('aria-label', t('shell.openNavigation'));
  const foot = document.querySelector('#sidebar .foot');
  if(foot) foot.textContent = 'Small Business Manager Pro \u00b7 ' + t('shell.allDataStoredLocally');
}

/* ================= CHART HELPERS ================= */
const CHART_PALETTE = ['#00327D','#D50083','#1E8F5C','#B7791F','#5471A3','#C0293F','#0B4FA0','#8AA0C9','#E39FC2','#8FBFA3'];
// One place to set the chart typography/color defaults so every chart — axis ticks,
// legends, tooltips — renders in the same embedded Montserrat used by the rest of
// the YDC UI, with no per-chart repetition.
if(typeof Chart !== 'undefined'){
  Chart.defaults.font.family = "'Montserrat','Segoe UI',system-ui,sans-serif";
  Chart.defaults.color = '#616B7A';
}
const CHART_REGISTRY = {};
function destroyChartIfExists(canvasId){
  if(CHART_REGISTRY[canvasId]){
    try{ CHART_REGISTRY[canvasId].destroy(); }catch(e){}
    delete CHART_REGISTRY[canvasId];
  }
}
function chartGetCanvas(canvasId){
  const el = document.getElementById(canvasId);
  return el ? el.getContext('2d') : null;
}
function moneyTickCallback(v){ return currencySymbol() + Number(v).toLocaleString(); }
function baseLineOptions(moneyAxis){
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index', intersect:false},
    plugins:{ legend:{display:true, labels:{boxWidth:11, font:{size:11}}},
      tooltip:{callbacks: moneyAxis ? { label(ctx){ return ' ' + ctx.dataset.label + ': ' + fmtMoney(ctx.parsed.y); } } : {} } },
    scales:{ y:{ beginAtZero:true, ticks:{ callback: moneyAxis?moneyTickCallback:undefined, font:{size:10.5} }, grid:{color:'#EEEBE2'} },
             x:{ ticks:{font:{size:10.5}}, grid:{display:false} } }
  };
}
function baseBarOptions(horizontal, moneyAxis){
  return {
    responsive:true, maintainAspectRatio:false, indexAxis: horizontal?'y':'x',
    plugins:{ legend:{display:false},
      tooltip:{callbacks: moneyAxis ? { label(ctx){ return ' ' + fmtMoney(horizontal?ctx.parsed.x:ctx.parsed.y); } } : {} } },
    scales: horizontal ? {
      x:{ type:'linear', beginAtZero:true, ticks:{ callback: moneyAxis?moneyTickCallback:undefined, font:{size:10.5} }, grid:{color:'#EEEBE2'} },
      y:{ type:'category', ticks:{ font:{size:10.5} }, grid:{color:'transparent'} }
    } : {
      x:{ type:'category', ticks:{ font:{size:10.5} }, grid:{display:false} },
      y:{ type:'linear', beginAtZero:true, ticks:{ callback: moneyAxis?moneyTickCallback:undefined, font:{size:10.5} }, grid:{color:'#EEEBE2'} }
    }
  };
}
function doughnutOptions(){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{position:'right', labels:{boxWidth:11, font:{size:11}}},
      tooltip:{callbacks:{ label(ctx){ return ' ' + ctx.label + ': ' + fmtMoney(ctx.parsed); } } } }
  };
}

      borderColor: CHART_PALETTE[0], backgroundColor:'rgba(0,50,125,0.10)',

    ]},

      ...baseLineOptions(true),

        ...baseLineOptions(true).plugins,

          ...baseLineOptions(true).plugins.legend,

            ...baseLineOptions(true).plugins.legend.labels,

        <div class="alert alert-${a.type==='danger'?'danger':(a.type==='warning'?'warning':'info')}" data-alert-link="${a.link}" style="cursor:pointer;">
          <span class="ic">${a.type==='danger'?'&#9888;':(a.type==='warning'?'&#9888;':'&#8505;' )}</span>
          <div><strong>${escapeHtml(a.title)}</strong>${escapeHtml(a.text)}</div>
        </div>`).join('')}</div>` : ''}
    </div>
  `;

  wireRangeFilterBar(el, 'dashboard', ()=>mountDashboardPage(el));
  el.querySelectorAll('[data-alert-link]').forEach(a=>a.addEventListener('click', ()=>navigateTo(a.getAttribute('data-alert-link'))));
  el.querySelectorAll('[data-dash-action]').forEach(btn=>btn.addEventListener('click', ()=>{
    const action = btn.getAttribute('data-dash-action');
    if(action==='new-sale') openSaleForm();
    else if(action==='product') openProductForm();
    else if(action==='expense') openExpenseForm();
    else if(action==='reports') navigateTo('reports');
  }));

  chartRevenueTrend('chart-dash-revenue', 6);
  chartProfitTrend('chart-dash-profit', 6);
  chartCashFlowTrend('chart-dash-cashflow', 6);
  chartExpenseBreakdown('chart-dash-expenses', range);
  chartTopProducts('chart-dash-topproducts', range);
  chartSalesByCategory('chart-dash-category', range);
}

/* ============================================================
   DEMO DATA GENERATOR, START FRESH, BACKUP/RESTORE, WELCOME GATE,
   AND APP BOOTSTRAP
   ============================================================ */
'use strict';

/* ---------- Date helpers for demo data ---------- */
function daysAgoISO(n){
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }

/* ---------- Demo data generator (reuses the real controlled transaction
   functions so every rule — stock checks, COGS snapshotting, fee logic —
   is guaranteed identical to what a real user would experience). ---------- */
function generateDemoRecords(){
  // Suppliers
  const supplierIds = [
    createSupplier({name:'BrightPack Supplies', contact:'Dana Reyes', email:'orders@brightpack.example', phone:'555-0114'}).id,
    createSupplier({name:'Coastal Craft Materials', contact:'Tomás Ibarra', email:'sales@coastalcraft.example', phone:'555-0187'}).id,
    createSupplier({name:'Golden Thread Wholesale', contact:'Priya Nair', email:'hello@goldenthread.example', phone:'555-0142'}).id
  ];

  // Products (name, sku, category, unitCost, price, reorderLevel, supplier index)
  const productDefs = [
    ['Woven Macrame Wall Hanging','WMH-001','Home Decor', 9.50, 34.00, 5, 1],
    ['Hand-Poured Soy Candle — Cedar','CND-014','Candles', 3.20, 14.00, 10, 0],
    ['Hand-Poured Soy Candle — Vanilla Bloom','CND-015','Candles', 3.20, 14.00, 10, 0],
    ['Beaded Wrap Bracelet','JWL-022','Jewelry', 4.10, 18.00, 8, 2],
    ['Minimalist Hoop Earrings','JWL-031','Jewelry', 3.60, 22.00, 8, 2],
    ['Linen Zip Pouch','ACC-007','Accessories', 5.80, 19.00, 6, 1],
    ['Botanical Print Tote Bag','APP-009','Apparel', 6.40, 26.00, 6, 1],
    ['Watercolor Art Print — Meadow','ART-003','Art & Prints', 2.10, 16.00, 12, 0],
    ['Ceramic Trinket Dish','HD-018','Home Decor', 4.90, 20.00, 6, 1],
    ['Embroidered Zip Pouch, Mini','ACC-011','Accessories', 2.75, 12.00, 4, 2]
  ];
  const productIds = productDefs.map(([name,sku,category,unitCost,price,reorderLevel,supIdx])=>{
    return createProduct({ name, sku, category, unitCost, price, quantity: 0, reorderLevel, supplierId: supplierIds[supIdx] }).id;
  });

  // Customers
  const customerNames = ['Ava Thompson','Liam Carter','Sophia Martinez','Noah Bennett','Isabella Nguyen','Mason Wright','Olivia Brooks','Ethan Rivera'];
  const customerIds = customerNames.map(name=> createCustomer({
    name, email: name.toLowerCase().replace(' ','.') + '@example.com', phone: '555-0' + randInt(100,999)
  }).id);

  // Payment methods (already seeded by defaultState) — grab ids for reuse
  const pmIds = STORE.state.paymentMethods.map(p=>p.id);

  // ---- Purchases: stock every product with 2-3 shipments over the last ~5 months ----
  productIds.forEach((pid, idx)=>{
    const def = productDefs[idx];
    const shipments = idx === 6 ? 1 : randInt(2,3); // keep one product (Tote Bag) intentionally low on stock
    for(let i=0;i<shipments;i++){
      const qty = idx === 6 ? randInt(2,4) : randInt(15,35);
      const costWiggle = round2(def[3] * (0.92 + Math.random()*0.16));
      recordPurchase({
        date: daysAgoISO(randInt(20, 165)),
        supplierId: supplierIds[def[6]],
        productId: pid,
        quantity: qty,
        unitCost: costWiggle,
        paymentMethodId: pick(pmIds),
        notes: i===0 ? 'Initial stock order' : 'Restock'
      });
    }
  });

  // ---- Sales: ~46 orders spread across the last 5 months, mostly Completed ----
  const activeProds = STORE.state.products.filter(p=>p.status!=='archived');
  let salesGenerated = 0;
  const SALE_COUNT = 46;
  for(let i=0; i<SALE_COUNT; i++){
    const daysBack = i < 36 ? randInt(1,150) : randInt(0,6); // bias some orders into the current week
    const date = daysAgoISO(daysBack);
    const lineCount = randInt(1,3);
    const usedProductIds = new Set();
    const items = [];
    for(let l=0; l<lineCount; l++){
      const product = pick(activeProds);
      if(usedProductIds.has(product.id)) continue;
      usedProductIds.add(product.id);
      const qty = randInt(1,3);
      const discount = Math.random() < 0.12 ? round2(product.price * 0.1) : 0;
      items.push({ productId: product.id, quantity: qty, unitPrice: product.price, discount });
    }
    if(!items.length) continue;
    const revenueEstimate = round2(items.reduce((a,it)=>a + it.quantity*it.unitPrice - it.discount, 0));
    const shipping = Math.random() < 0.4 ? round2(randInt(3,6)) : 0;
    const sellingFee = round2((revenueEstimate + shipping) * 0.075);
    let status = 'Completed';
    if(i === SALE_COUNT-3) status = 'New';
    else if(i === SALE_COUNT-2) status = 'Processing';
    else if(i === SALE_COUNT-1) status = 'Cancelled';
    const res = createSale({
      date, customerId: Math.random()<0.85 ? pick(customerIds) : '',
      paymentMethodId: pick(pmIds), status, shippingCharged: shipping,
      actualShippingCost: status==='Completed' ? round2(shipping * (0.55 + Math.random()*0.30)) : 0,
      sellingFee: status==='Completed'?sellingFee:0,
      taxRate: 8.25,
      notes: ''
    }, items, {forceOversell:false});
    if(res.ok) salesGenerated++;
    // Refund one recent completed order for demonstration
    if(res.ok && i === SALE_COUNT-8 && status === 'Completed'){
      trySetSaleStatus(res.id, 'Refunded');
    }
  }

  // ---- Expenses across categories over the last 5 months (kept modest, as a
  // healthy small handmade business typically runs) ----
  const expenseDefs = [
    ['Advertising','Etsy Ads boost'], ['Advertising','Instagram promoted post'],
    ['Packaging','Kraft boxes & tissue paper'], ['Packaging','Branded stickers'],
    ['Shipping','Priority mail supplies'], ['Software','Design software subscription'],
    ['Supplies','Craft studio supplies'], ['Marketing','Craft fair booth fee'],
    ['Equipment','Replacement soldering tool'], ['Utilities','Studio electricity, monthly']
  ];
  expenseDefs.forEach(([category, description])=>{
    recordExpense({ date: daysAgoISO(randInt(2,160)), category, description, amount: round2(randInt(9,65) + Math.random()), paymentMethodId: pick(pmIds) });
  });
  // Rent: fixed modest monthly recurring line, two months
  recordExpense({ date: daysAgoISO(20), category:'Rent', description:'Shared studio space, monthly', amount: 65.00, paymentMethodId: pick(pmIds) });
  recordExpense({ date: daysAgoISO(50), category:'Rent', description:'Shared studio space, monthly', amount: 65.00, paymentMethodId: pick(pmIds) });

  // ---- Standalone selling fees (recurring platform charges) ----
  for(let m=0;m<5;m++){
    recordFee({ date: daysAgoISO(m*30 + randInt(1,5)), category:'Listing Fees', label:'Monthly Etsy listing renewals', amount: round2(randInt(4,9) + Math.random()) });
  }

  // ---- Other income ----
  recordOtherIncome({ date: daysAgoISO(randInt(10,60)), description:'Local craft fair table sales (cash)', amount: 96.00 });
  recordOtherIncome({ date: daysAgoISO(randInt(60,140)), description:'Referral bonus from supplier', amount: 25.00 });

  // ---- Business goals (a realistic mix: some on track, some completed, some behind) ----
  createGoal({ name:'This Quarter Revenue Goal', type:'revenue', targetValue: 2200, startDate: daysAgoISO(45), deadline: daysAgoISO(-45) });
  createGoal({ name:'Net Profit Goal', type:'profit', targetValue: 500, startDate: daysAgoISO(45), deadline: daysAgoISO(-30) });
  createGoal({ name:'Orders Milestone', type:'orders', targetValue: 30, startDate: daysAgoISO(60), deadline: daysAgoISO(-20) });
  createGoal({ name:'Healthy Net Margin', type:'margin', targetValue: 25, startDate: daysAgoISO(60), deadline: daysAgoISO(-10) });
  createGoal({ name:'Instagram Followers', type:'custom', targetValue: 2000, currentValueOverride: 1180, startDate: daysAgoISO(90), deadline: daysAgoISO(30), notes:'Tracked manually outside this app.' });
}

/* ---------- Load Demo Data: runs the generator against a clean state,
   suppressing intermediate saves/renders for performance, then commits
   once at the end. ---------- */
function loadDemoData(){
  const realSave = STORE.save.bind(STORE);
  const realRender = STORE.render.bind(STORE);
  STORE.state = defaultState();
  STORE.save = function(){};
  STORE.render = function(){};
  let generationError = null;
  try{
    generateDemoRecords();
  } catch(e){
    generationError = e;
    console.error('Demo data generation failed', e);
  } finally {
    STORE.save = realSave;
    STORE.render = realRender;
  }
  if(generationError){
    STORE.state = defaultState();
    toast('Demo data could not be loaded. Please try again.', 'error');
    return;
  }
  STORE.state.meta.demoLoaded = true;
  STORE.state.meta.onboarded = true;
  STORE.state.settings.disclaimerAcknowledged = true;
  STORE.save();
  STORE.render();
}

/* ---------- Start Fresh: clears all transactional/business records but
   keeps Settings, Categories, and Payment Methods intact. ---------- */
function startFresh(){
  STORE.mutate(s=>{
    s.products = []; s.customers = []; s.suppliers = [];
    s.sales = []; s.saleItems = []; s.purchases = []; s.inventoryAdjustments = [];
    s.expenses = []; s.fees = []; s.otherIncome = []; s.goals = [];
    s.meta.demoLoaded = false;
    s.meta.onboarded = true;
  });
}

/* ---------- Reset All Data: full first-run reset, including settings,
   categories, and payment methods. Re-shows the Welcome Gate. ---------- */
function resetAllData(){
  STORE.state = defaultState();
  STORE.save();
  STORE.render();
}

/* ---------- Backup export / import ---------- */
function exportBackup(){
  const payload = JSON.stringify(STORE.state, null, 2);
  downloadFile(`small-business-manager-pro-backup-${todayISO()}.json`, payload, 'application/json');
  toast(t('backup.toastExported'), 'success');
}
function importBackupFile(file){
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast(t('backup.notValidJson'), 'error'); return; }
    const errors = validateStateShape(parsed);
    if(errors.length){
      const moreIssues = errors.length>1 ? tc('backup.andMoreIssues', errors.length-1) : '';
      toast(t('backup.importFailed',{error:errors[0]}) + moreIssues, 'error');
      return;
    }
    confirmAction(t('backup.confirmImport'), ()=>{
      STORE.state = migrateState(parsed);
      STORE.state.meta.onboarded = true;
      STORE.save();
      STORE.render();
      toast(t('backup.toastImported'), 'success');
      navigateTo('dashboard');
    }, {title:t('backup.importBackupTitle'), confirmLabel:t('backup.importAndReplace')});
  };
  reader.onerror = ()=>{ toast(t('backup.couldNotReadFile'), 'error'); };
  reader.readAsText(file);
}

function renderWelcomeGate(el){
  el.innerHTML = `
    <div class="welcome-card">
      <h2>${escapeHtml(t('welcome.title'))}</h2>
      <div class="sub">${escapeHtml(t('welcome.subtitle'))}</div>
      <div class="welcome-choice">
        <button class="welcome-option" id="wg-demo" type="button">
          <div class="opt-icon">&#10024;</div>
          <h4>${escapeHtml(t('welcome.demoTitle'))}</h4>
          <p>${escapeHtml(t('welcome.demoText'))}</p>
        </button>
        <button class="welcome-option" id="wg-fresh" type="button">
          <div class="opt-icon">&#128204;</div>
          <h4>${escapeHtml(t('welcome.freshTitle'))}</h4>
          <p>${escapeHtml(t('welcome.freshText'))}</p>
        </button>
      </div>
      <div class="welcome-disclaimer">${escapeHtml(t('welcome.disclaimer'))}</div>
    </div>
  `;
  el.querySelector('#wg-demo').addEventListener('click', ()=>{ loadDemoData(); toast(t('welcome.toastDemoLoaded'), 'success'); });
  el.querySelector('#wg-fresh').addEventListener('click', ()=>{
    STORE.mutate(s=>{ s.meta.onboarded = true; s.settings.disclaimerAcknowledged = true; });
  });
}

/* ---------- App bootstrap ---------- */
function initApp(){
  STORE.load();
  initShellChrome();
  STORE.render();
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
